// ── STOCK (boxes — the physical opening inventory, tagged to reserves) ────────
function Stock({ data, derived, onRefresh }) {
  const [mode, setMode] = useState(null); // null | 'add' | {editing}
  const [saving, setSaving] = useState(false);
  const blank = { ID:'', 'Box Name':'', Metal:'Gold', Description:'', Location:'', Pieces:'', 'Gross Weight Grams':'', 'Weight Grams':'', Status:'In Stock', Notes:'', 'Reserve Type':'' };
  const [form, setForm] = useState(blank);
  const f = (k,v) => setForm(p => ({...p,[k]:v}));

  const openAdd = () => { setForm(blank); setMode('add'); };
  const openEdit = (b) => { setForm({...blank, ...b}); setMode({ editing: b._row, created: b.Created }); };

  // Reserve-type options matching the box metal
  const rtOptions = (metal) => metal==='Silver' ? ['Silver','Old Silver'] : ['Ornaments','Gold Metal','Old Gold','Own Use Gold'];

  const handleSave = async () => {
    if (!form['Box Name'] || form['Weight Grams']==='') { alert('Box name and net weight are required.'); return; }
    setSaving(true);
    try {
      const status = num(form['Weight Grams'])>0?'In Stock':'Empty';
      if (mode === 'add') {
        await appendRow('Stock', rowValues('Stock', { ...form, ID: uid('B'), Status: status, Created: todayStr() }));
      } else {
        await updateRow('Stock', mode.editing, rowValues('Stock', { ...form, Status: status, Created: mode.created||'' }));
      }
      setMode(null); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const sorted = [...data.stock].sort((a,b) => (a['Reserve Type']||'~').localeCompare(b['Reserve Type']||'~') || (a['Box Name']||'').localeCompare(b['Box Name']||''));
  const untagged = data.stock.filter(b => !RESERVE_NAMES.includes((b['Reserve Type']||'').trim())).length;
  // opening contribution per reserve (metals only)
  const openingByReserve = {};
  RESERVES.filter(r=>r.kind!=='Cash').forEach(r => openingByReserve[r.name] = derived.reserves.find(x=>x.name===r.name)?.stockOpening || 0);

  return (
    <div>
      <div className="stats-row">
        {RESERVES.filter(r=>r.kind!=='Cash').map(r => (
          <div className="stat-card" key={r.name}>
            <div className="stat-label">{r.emoji} {r.name}</div>
            <div className={`stat-value ${r.kind==='Silver'?'silver':'gold'}`} style={{fontSize:18}}>{fmtG(openingByReserve[r.name])}</div>
            <div className="stat-sub">opening from boxes</div>
          </div>
        ))}
      </div>

      {untagged>0 && <div className="card" style={{marginBottom:16,borderColor:'rgba(245,158,11,.3)'}}>
        <div style={{fontSize:13,color:'var(--gold)'}}>⚠️ {untagged} box{untagged>1?'es':''} not yet tagged to a reserve — edit each box and set its <b>Reserve Type</b> so it counts towards an opening balance.</div>
      </div>}

      <div className="section-row">
        <div>
          <h3>Stock Boxes</h3>
          <p style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>Your physical opening inventory. Live balances move on the Reserves & Convert screens.</p>
        </div>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/> Add Box</button>
      </div>

      {mode !== null && (
        <div className="card" style={{marginBottom:16}}>
          <div className="card-title">{mode==='add' ? 'New Box / Pocket / Container' : 'Edit Box'}</div>
          <div className="form-grid">
            <div className="form-group"><label>Box Name *</label><input placeholder="e.g. Box 3 / Red Pocket" value={form['Box Name']} onChange={e=>f('Box Name',e.target.value)}/></div>
            <div className="form-group"><label>Metal</label><select value={form.Metal} onChange={e=>{const m=e.target.value; setForm(p=>({...p,Metal:m, 'Reserve Type': rtOptions(m).includes(p['Reserve Type'])?p['Reserve Type']:''}));}}><option>Gold</option><option>Silver</option></select></div>
            <div className="form-group"><label>Reserve Type <span style={{color:'var(--text-muted)'}}>which reserve</span></label>
              <select value={form['Reserve Type']} onChange={e=>f('Reserve Type',e.target.value)}>
                <option value="">— not tagged —</option>
                {rtOptions(form.Metal).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="form-group" style={{gridColumn:'1/-1'}}><label>What is inside</label><input placeholder="e.g. 4 rings, 2 chains, 1 bangle" value={form.Description} onChange={e=>f('Description',e.target.value)}/></div>
            <div className="form-group"><label>Kept At (location)</label><input placeholder="e.g. Shop almirah / Bank locker" value={form.Location} onChange={e=>f('Location',e.target.value)}/></div>
            <div className="form-group"><label>Pieces</label><input type="number" placeholder="7" value={form.Pieces} onChange={e=>f('Pieces',e.target.value)}/></div>
            <div className="form-group"><label>Gross Weight (g) <span style={{color:'var(--text-muted)'}}>with stones</span></label><input type="number" step="0.001" placeholder="45.200" value={form['Gross Weight Grams']} onChange={e=>f('Gross Weight Grams',e.target.value)}/></div>
            <div className="form-group"><label>Net Weight (g) * <span style={{color:'var(--text-muted)'}}>pure metal</span></label><input type="number" step="0.001" placeholder="42.350" value={form['Weight Grams']} onChange={e=>f('Weight Grams',e.target.value)}/></div>
            <div className="form-group"><label>Notes</label><input placeholder="Purity, source..." value={form.Notes} onChange={e=>f('Notes',e.target.value)}/></div>
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<span className="spinner"/>:mode==='add'?'Save Box':'Update Box'}</button>
            <button className="btn btn-secondary" onClick={()=>setMode(null)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="card">
        {sorted.length === 0 ? <div className="empty"><p>No boxes yet — add your first box/pocket above.</p></div> :
        <div className="table-wrap"><table>
          <thead><tr><th>Box</th><th>Reserve</th><th>Metal</th><th>What's Inside</th><th>Kept At</th><th>Pieces</th><th>Gross Wt</th><th>Net Wt</th><th></th></tr></thead>
          <tbody>{sorted.map(b => {
            const tagged = RESERVE_NAMES.includes((b['Reserve Type']||'').trim());
            return (
            <tr key={b.ID}>
              <td className="name">{b['Box Name']}</td>
              <td>{tagged ? <span className="badge badge-blue">{b['Reserve Type']}</span> : <span className="badge badge-gold">untagged</span>}</td>
              <td><span className={`badge ${b.Metal==='Silver'?'badge-silver':'badge-gold'}`}>{b.Metal}</span></td>
              <td>{b.Description||'—'}</td>
              <td>{b.Location||'—'}</td>
              <td className="mono">{b.Pieces||'—'}</td>
              <td className="mono" style={{color:'var(--text-muted)'}}>{num(b['Gross Weight Grams'])>0?fmtG(b['Gross Weight Grams']):'—'}</td>
              <td className="mono" style={{color:num(b['Weight Grams'])>0?'var(--text-primary)':'var(--text-muted)'}}>{fmtG(b['Weight Grams'])}</td>
              <td><button className="btn btn-secondary btn-sm" title="Edit" onClick={()=>openEdit(b)}>✏️</button></td>
            </tr>);
          })}</tbody>
        </table></div>}
      </div>
    </div>
  );
}

// ── CONVERT / NEW TRANSACTION — universal multi-reserve conversion ───────────
function legQty(leg) { return isCash(leg.reserve) ? num(leg.value) : qtyFromGold(leg.weight, leg.touch, leg.margin, leg.direct); }
function legValue(leg) { return isCash(leg.reserve) ? num(leg.value) : num(leg.value); }

// Rebuild an editable leg from a saved Entry row
function entryToLeg(e) {
  const cash = isCash(e.Reserve);
  const hasWeight = e['Weight Grams'] !== '' && e['Weight Grams'] !== undefined;
  return {
    key: uid('lg'), direction: e.Direction, reserve: e.Reserve, subtype: e.Subtype || '',
    weight: cash ? '' : (hasWeight ? e['Weight Grams'] : ''),
    touch:  cash ? '100' : (e.Touch !== '' ? e.Touch : '100'),
    margin: cash ? '0'  : (e.Margin !== '' ? e.Margin : '0'),
    direct: cash ? '' : (hasWeight ? '' : e.Qty),
    value:  cash ? e.Qty : (e.Value || ''),
  };
}

// Categories that belong to a linked record (lending, rent, …) — they are
// managed from their own pages, so they're excluded from the free-type
// suggestions and from direct editing on the Transactions page.
const LINKED_CATS = ['Lending','Lending Return','Expense','Rent','Maintenance','Investment','Investment Return'];

function Convert({ data, derived, onRefresh, onDone, edit }) {
  const [saving, setSaving] = useState(false);
  const [date, setDate] = useState(edit ? edit.date : todayStr());
  const [counterparty, setCounterparty] = useState(edit ? edit.counterparty : '');
  const [notes, setNotes] = useState(edit ? edit.notes : '');
  const [txnType, setTxnType] = useState(edit ? (edit.entries[0]?.Category || 'Convert') : 'Convert');
  // Editable dropdown options: defaults + every type already used in the ledger.
  const typeOpts = useMemo(() => {
    const used = data.entries.map(e => (e.Category||'').trim()).filter(c => c && !LINKED_CATS.includes(c));
    return [...new Set(['Convert','Sale','Purchase','Exchange', ...used])];
  }, [data.entries]);
  const [remindDate, setRemindDate] = useState('');
  const [remindTitle, setRemindTitle] = useState('');

  const newLeg = (direction) => ({ key: uid('lg'), direction, reserve: direction==='Out'?'Ornaments':'Cash', subtype:'', weight:'', touch:'100', margin:'0', direct:'', value:'' });
  const [legs, setLegs] = useState(edit ? edit.entries.map(entryToLeg) : [newLeg('Out'), newLeg('In')]);
  const upd = (key, patch) => setLegs(ls => ls.map(l => l.key===key ? { ...l, ...patch } : l));
  const addLeg = (dir) => setLegs(ls => [...ls, newLeg(dir)]);
  const delLeg = (key) => setLegs(ls => ls.filter(l => l.key!==key));

  const outLegs = legs.filter(l => l.direction==='Out');
  const inLegs  = legs.filter(l => l.direction==='In');
  const outValue = outLegs.reduce((s,l)=>s+legValue(l),0);
  const inValue  = inLegs.reduce((s,l)=>s+legValue(l),0);
  const diff = Math.round((outValue - inValue)*100)/100;

  const handleSave = async () => {
    const active = legs.filter(l => legQty(l) > 0 || legValue(l) > 0);
    if (active.length === 0) { alert('Add at least one leg with a quantity or value.'); return; }
    // Validate metal/cash OUT legs against current balance (skip when editing — old legs are already counted)
    if (!edit) for (const l of active) {
      if (l.direction==='Out' && !isCash(l.reserve)) {
        const bal = derived.balOf(l.reserve);
        if (legQty(l) > bal + 0.001) { alert(`"${l.reserve}" has only ${fmtG(bal)} — this leg removes ${fmtG(legQty(l))}.`); return; }
      }
      if (l.direction==='Out' && isCash(l.reserve)) {
        const bal = derived.balOf(l.reserve);
        if (num(l.value) > bal + 0.5) { alert(`"${l.reserve}" has only ${fmtINR(bal)} — this leg removes ${fmtINR(num(l.value))}.`); return; }
      }
    }
    setSaving(true);
    try {
      // Editing replaces the transaction: delete the old legs, re-post under the same id.
      const txnId = edit ? edit.txnId : uid('TX');
      if (edit) await deleteTxn(edit.txnId);
      for (const l of active) {
        await addEntry(txnId, date, {
          reserve: l.reserve, subtype: l.subtype, direction: l.direction, qty: legQty(l),
          weight: isCash(l.reserve)?'':l.weight, touch: isCash(l.reserve)?'':l.touch, margin: isCash(l.reserve)?'':l.margin,
          value: legValue(l), counterparty, category: txnType.trim() || 'Convert', ref: '', notes,
        });
      }
      if (!edit && (remindDate || remindTitle.trim())) {
        await appendRow('Reminders', [uid('RM'), todayStr(), remindDate, remindTitle.trim() || `Follow up ${counterparty||'transaction'}`, 'Transaction', txnId, 'Open', notes]);
      }
      onRefresh();
      onDone();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const renderLeg = (l) => {
    const cash = isCash(l.reserve);
    const qty = legQty(l);
    return (
      <div className="item-row" key={l.key}>
        <div className="form-group"><label>Reserve</label>
          <select value={l.reserve} onChange={e=>upd(l.key,{reserve:e.target.value, subtype:''})}>
            {derived.reserves.map(r=><option key={r.name} value={r.name}>{r.name} ({fmtReserve(r.name, r.balance)})</option>)}
          </select>
        </div>
        <div className="form-group"><label>Subtype</label>
          {(() => {
            // Configured categories (Reserves sheet) + distinct box names tagged to this reserve
            const cfg = derived.reserves.find(r => r.name === l.reserve)?.subtypes || [];
            const boxNames = cash ? [] : data.stock.filter(b => b['Reserve Type'] === l.reserve).map(b => b['Box Name']).filter(Boolean);
            const opts = [...new Set([...cfg, ...boxNames])];
            return opts.length > 0 ? (
              <select value={l.subtype} onChange={e=>upd(l.key,{subtype:e.target.value})}>
                <option value="">— select pocket / type —</option>
                {opts.map(opt => <option key={opt} value={opt}>{opt}</option>)}
              </select>
            ) : (
              <input placeholder="optional" value={l.subtype} onChange={e=>upd(l.key,{subtype:e.target.value})}/>
            );
          })()}
        </div>
        {cash ? (
          <div className="form-group"><label>Amount ₹</label><input type="number" value={l.value} onChange={e=>upd(l.key,{value:e.target.value})}/></div>
        ) : (<>
          <div className="form-group"><label>Weight (g)</label><input type="number" step="0.001" value={l.weight} onChange={e=>upd(l.key,{weight:e.target.value})} disabled={l.direct!==''}/></div>
          <div className="form-group"><label>Touch</label><input type="number" step="0.1" value={l.touch} onChange={e=>upd(l.key,{touch:e.target.value})} disabled={l.direct!==''}/></div>
          <div className="form-group"><label>Margin</label><input type="number" step="0.1" value={l.margin} onChange={e=>upd(l.key,{margin:e.target.value})} disabled={l.direct!==''}/></div>
          <div className="form-group"><label>Direct g <span style={{color:'var(--text-muted)'}}>override</span></label><input type="number" step="0.001" placeholder="—" value={l.direct} onChange={e=>upd(l.key,{direct:e.target.value})}/></div>
          <div className="form-group"><label>Value ₹ <span style={{color:'var(--text-muted)'}}>optional</span></label><input type="number" value={l.value} onChange={e=>upd(l.key,{value:e.target.value})}/></div>
        </>)}
        <button className="row-del" title="Remove" onClick={()=>delLeg(l.key)}>✕</button>
        {!cash && qty>0 && <div style={{gridColumn:'1/-1',fontSize:11,color:'var(--gold)',marginTop:-2}}>→ {fmtG(qty)} into/out of {l.reserve}{l.direct===''?` (${l.weight||0}g × (${l.touch||0}+${l.margin||0})/100)`:' (direct)'}</div>}
      </div>
    );
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">{edit ? '✏️ Edit Transaction' : 'Transaction Details'}</div>
        <div className="form-grid">
          <div className="form-group"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div className="form-group"><label>Type <span style={{color:'var(--text-muted)'}}>pick or type a new one</span></label>
            <input list="txn-type-opts" placeholder="Convert" value={txnType} onChange={e=>setTxnType(e.target.value)}/>
            <datalist id="txn-type-opts">{typeOpts.map(t=><option key={t} value={t}/>)}</datalist>
          </div>
          <div className="form-group"><label>Counterparty <span style={{color:'var(--text-muted)'}}>customer / person</span></label><input placeholder="Name (optional)" value={counterparty} onChange={e=>setCounterparty(e.target.value)}/></div>
          <div className="form-group" style={{gridColumn:'1/-1'}}><label>Notes</label><input placeholder="What is this transaction" value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        </div>
      </div>

      <div className="card">
        <div className="section-row" style={{marginBottom:10}}>
          <div className="card-title" style={{marginBottom:0}}>↑ Removed (Out) <span style={{fontWeight:400,textTransform:'none',color:'var(--text-muted)'}}>— reserves that go down</span></div>
          <button className="btn btn-secondary btn-sm" onClick={()=>addLeg('Out')}><Icon name="minus" size={12}/> Add Out</button>
        </div>
        {outLegs.length===0 && <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing removed.</div>}
        {outLegs.map(renderLeg)}
      </div>

      <div className="card">
        <div className="section-row" style={{marginBottom:10}}>
          <div className="card-title" style={{marginBottom:0}}>↓ Added (In) <span style={{fontWeight:400,textTransform:'none',color:'var(--text-muted)'}}>— reserves that go up</span></div>
          <button className="btn btn-secondary btn-sm" onClick={()=>addLeg('In')}><Icon name="plus" size={12}/> Add In</button>
        </div>
        {inLegs.length===0 && <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing added.</div>}
        {inLegs.map(renderLeg)}
      </div>

      <div className="card">
        <div className="card-title">Balance & Save</div>
        <div className="settle-box">
          <div className="settle-line"><span>Total value removed (out)</span><span className="mono">{fmtINR(outValue)}</span></div>
          <div className="settle-line"><span>Total value added (in)</span><span className="mono">{fmtINR(inValue)}</span></div>
          <div className="settle-line total"><span>{Math.abs(diff)<.5 ? '✓ Value balanced' : diff>0 ? 'Out exceeds In by' : 'In exceeds Out by'}</span><span className="mono" style={{color:Math.abs(diff)<.5?'var(--green)':'var(--gold)'}}>{fmtINR(Math.abs(diff))}</span></div>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:8}}>Value balance is only a cross-check (fill ₹ value on metal legs if you want it to tally) — the reserve quantities always post regardless.</div>
        {!edit && <div className="form-grid" style={{marginTop:14}}>
          <div className="form-group"><label>🔔 Reminder date <span style={{color:'var(--text-muted)'}}>optional</span></label><input type="date" value={remindDate} onChange={e=>setRemindDate(e.target.value)}/></div>
          <div className="form-group"><label>Reminder note</label><input placeholder="e.g. collect balance / give receipt" value={remindTitle} onChange={e=>setRemindTitle(e.target.value)}/></div>
        </div>}
        <div className="btn-row">
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<><span className="spinner"/>&nbsp;Saving…</>:edit?'Update Transaction':'Save Transaction'}</button>
          <button className="btn btn-secondary" onClick={onDone}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── TRANSACTIONS — entries grouped by Txn ID, view & edit ────────────────────
function Transactions({ data, derived, onRefresh, onNew, onEdit, onNav }) {
  const [typeF, setTypeF] = useState('all');
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [q, setQ] = useState('');
  const [openTxn, setOpenTxn] = useState(null);
  const [busy, setBusy] = useState('');

  const getNavPage = (k) => {
    if (k === 'Rent') return 'rent';
    if (k === 'Lending' || k === 'Lending Return') return 'lending';
    if (k === 'Expense') return 'expenses';
    if (k === 'Maintenance') return 'maintenance';
    if (k === 'Investment' || k === 'Investment Return') return 'investments';
    return null;
  };

  // Group entry rows by Txn ID — rent collections, lending, returns/interest,
  // expenses and conversions ALL post Entries, so they all show up here.
  const groups = {};
  data.entries.forEach(e => { const k = e['Txn ID'] || e.ID; (groups[k] = groups[k] || []).push(e); });
  const list = Object.entries(groups).map(([txnId, legs]) => {
    const first = legs[0];
    const cats = [...new Set(legs.map(l => (l.Category||'').trim()).filter(Boolean))];
    // Linked categories (rent/lending/…) are edited on their own pages; every
    // other type — including user-defined ones — is editable here.
    const editable = !cats.some(c => LINKED_CATS.includes(c));
    let inV = 0, outV = 0;
    legs.forEach(l => { const v = num(l.Value) || (isCash(l.Reserve) ? num(l.Qty) : 0); if (l.Direction==='In') inV += v; else outV += v; });
    return {
      txnId, legs, date: dateKey(first.Date), counterparty: first.Counterparty || '', notes: first.Notes || '',
      cats, kind: cats[0] || 'Convert', editable, inV, outV, entryRows: legs.map(l => l._row),
    };
  }).sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.txnId||'').localeCompare(a.txnId||''));

  // Filter: type (dynamic — every category ever used) + date range + free text.
  const allTypes = [...new Set(list.flatMap(g => g.cats))].sort();
  const ql = q.trim().toLowerCase();
  const shown = list.filter(g =>
    (typeF==='all' || g.cats.includes(typeF)) &&
    (!from || g.date >= from) && (!to || g.date <= to) &&
    (!ql || [g.counterparty, g.notes, g.txnId, g.kind, ...g.legs.map(l => `${l.Reserve} ${l.Subtype||''} ${l.Notes||''} ${l.Counterparty||''}`)]
      .join(' ').toLowerCase().includes(ql))
  );
  const totals = shown.reduce((t,g) => ({ in: t.in+g.inV, out: t.out+g.outV }), { in:0, out:0 });

  const ymd = (dt) => new Date(dt.getTime() - dt.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const preset = (p) => {
    const now = new Date();
    if (p==='all') { setFrom(''); setTo(''); return; }
    if (p==='month') { setFrom(ymd(new Date(now.getFullYear(), now.getMonth(), 1))); setTo(ymd(now)); return; }
    if (p==='lastMonth') { setFrom(ymd(new Date(now.getFullYear(), now.getMonth()-1, 1))); setTo(ymd(new Date(now.getFullYear(), now.getMonth(), 0))); return; }
    if (p==='30') { setFrom(ymd(new Date(now.getTime()-30*86400000))); setTo(ymd(now)); return; }
    if (p==='year') { setFrom(ymd(new Date(now.getFullYear(), 0, 1))); setTo(ymd(now)); return; }
  };

  const doDelete = async (g) => {
    if (!window.confirm(`Delete this transaction (${g.legs.length} legs)? Reserve balances will adjust. This permanently removes the rows.`)) return;
    setBusy(g.txnId);
    try { await deleteTxn(g.txnId); onRefresh(); }
    catch(e) { alert('Error: '+e.message); }
    setBusy('');
  };

  const kindBadge = (k) => ({ Convert:'badge-blue', Lending:'badge-gold', 'Lending Return':'badge-gold', Rent:'badge-green', Expense:'badge-red', Maintenance:'badge-red', Investment:'badge-gold', 'Investment Return':'badge-green' }[k] || 'badge-blue');

  return (
    <div>
      <div className="card" style={{marginBottom:14}}>
        <div className="section-row" style={{marginBottom:10}}>
          <div className="card-title" style={{marginBottom:0}}>🔎 Filter</div>
          <button className="btn btn-primary" onClick={onNew}><Icon name="exchange" size={14}/> New Transaction</button>
        </div>
        <div className="form-grid">
          <div className="form-group"><label>Type</label>
            <select value={typeF} onChange={e=>setTypeF(e.target.value)}>
              <option value="all">All types</option>
              {allTypes.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label>From date</label><input type="date" value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div className="form-group"><label>To date</label><input type="date" value={to} onChange={e=>setTo(e.target.value)}/></div>
          <div className="form-group"><label>Search</label><input placeholder="person, note, reserve, id…" value={q} onChange={e=>setQ(e.target.value)}/></div>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:10,alignItems:'center'}}>
          {[['month','This month'],['lastMonth','Last month'],['30','Last 30 days'],['year','This year'],['all','All time']].map(([p,label]) =>
            <button key={p} className="btn btn-secondary btn-sm" onClick={()=>preset(p)}>{label}</button>)}
          {(typeF!=='all'||from||to||ql) && <button className="btn btn-secondary btn-sm" onClick={()=>{setTypeF('all');setFrom('');setTo('');setQ('');}}>✕ Clear filters</button>}
        </div>
        <div style={{display:'flex',gap:18,flexWrap:'wrap',borderTop:'1px solid var(--border)',paddingTop:10,marginTop:12,fontSize:13}}>
          <span><b>{shown.length}</b> of {list.length} transactions</span>
          <span style={{color:'var(--green)'}}>↓ In {fmtINR(totals.in)}</span>
          <span style={{color:'var(--red)'}}>↑ Out {fmtINR(totals.out)}</span>
          <span style={{color:'var(--text-muted)'}}>Net {fmtINR(Math.round((totals.in-totals.out)*100)/100)}</span>
        </div>
      </div>

      {shown.length===0 ? <div className="card"><div className="empty"><p>No transactions match this filter.</p></div></div> :
      <div className="gap-12">{shown.map(g => {
        const isOpen = openTxn===g.txnId;
        return (
          <div className="card" key={g.txnId} style={{padding:0,overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',cursor:'pointer',flexWrap:'wrap',gap:8}} onClick={()=>setOpenTxn(o=>o===g.txnId?null:g.txnId)}>
              <div>
                <div style={{fontWeight:600,fontSize:14}}>{g.counterparty || (g.kind==='Expense'?'Expense':'Transaction')} <span className={`badge ${kindBadge(g.kind)}`} style={{marginLeft:6}}>{g.kind}</span></div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{g.date} · {g.legs.length} leg{g.legs.length>1?'s':''}{g.notes?` · ${g.notes}`:''}</div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>
                  {g.legs.map(l => (
                    <span key={l.ID} className={`badge ${l.Direction==='In'?'badge-green':'badge-red'}`}>{l.Direction==='In'?'↓':'↑'} {l.Reserve} {fmtReserve(l.Reserve, l.Qty)}</span>
                  ))}
                </div>
                <span style={{color:'var(--text-muted)',fontSize:20,transition:'transform .2s',display:'inline-block',transform:isOpen?'rotate(90deg)':'none'}}>›</span>
              </div>
            </div>

            {isOpen && <div style={{borderTop:'1px solid var(--border)',padding:'14px 18px'}}>
              <div className="table-wrap"><table>
                <thead><tr><th>Dir</th><th>Reserve</th><th>Subtype</th><th>Qty</th><th>Touch</th><th>Value</th><th>Note</th></tr></thead>
                <tbody>{g.legs.map(l => (
                  <tr key={l.ID}>
                    <td><span className={`badge ${l.Direction==='In'?'badge-green':'badge-red'}`}>{l.Direction==='In'?'↓ In':'↑ Out'}</span></td>
                    <td className="name">{l.Reserve}</td>
                    <td>{l.Subtype||'—'}</td>
                    <td className="mono">{fmtReserve(l.Reserve, l.Qty)}</td>
                    <td className="mono" style={{color:'var(--text-muted)'}}>{l.Touch?`${l.Touch}${num(l.Margin)?'+'+l.Margin:''}`:'—'}</td>
                    <td className="mono">{l.Value?fmtINR(l.Value):'—'}</td>
                    <td style={{fontSize:12}}>{l.Notes||'—'}</td>
                  </tr>
                ))}</tbody>
              </table></div>
              <div className="btn-row">
                {g.editable
                  ? <button className="btn btn-primary btn-sm" onClick={()=>onEdit({ txnId:g.txnId, date:g.date, counterparty:g.counterparty, notes:g.notes, entryRows:g.entryRows, entries:g.legs })}>✏️ Edit</button>
                  : (() => {
                      const navPage = getNavPage(g.kind);
                      if (navPage && onNav) {
                        return (
                          <span style={{fontSize:12,color:'var(--text-muted)'}}>
                            This is linked to a {g.kind.toLowerCase()} record. <button className="btn-link" style={{background:'none', border:'none', color:'var(--gold)', textDecoration:'underline', cursor:'pointer', padding:0, fontSize:12, fontFamily:'inherit'}} onClick={(e) => { e.stopPropagation(); onNav(navPage); }}>Go to {g.kind} Page to Edit</button>
                          </span>
                        );
                      }
                      return <span style={{fontSize:12,color:'var(--text-muted)'}}>Edit this on the {g.kind} page — it is linked to that {g.kind.toLowerCase()} record.</span>;
                    })()
                }
                <button className="btn btn-danger btn-sm" onClick={()=>doDelete(g)} disabled={busy===g.txnId}>{busy===g.txnId?<span className="spinner"/>:'🗑 Delete'}</button>
              </div>
            </div>}
          </div>
        );
      })}</div>}
    </div>
  );
}

// ── RESERVES — balances, opening, subtypes & per-reserve ledger ──────────────
function ReservesPage({ data, derived, onRefresh, onNew }) {
  const [openRes, setOpenRes] = useState(null);
  const [showAllTxns, setShowAllTxns] = useState(false);
  const [editRes, setEditRes] = useState(null); // reserve name being edited
  const [saving, setSaving] = useState(false);
  const [edit, setEdit] = useState({ opening:'', subtypes:'' });
  const [showAddBank, setShowAddBank] = useState(false);
  const [bank, setBank] = useState({ name:'', opening:'', notes:'' });

  const startEdit = (r) => { setEditRes(r.name); setEdit({ opening: r.isBank ? (r.bankOpening||0) : (r.manualOpening||0), subtypes: r.isBank ? (r.bankNotes||'') : (r.subtypes||[]).join(', ') }); };
  const saveEdit = async (r) => {
    setSaving(true);
    try {
      if (r.isBank) {
        await updateRow('Banks', r.bankRow, rowValues('Banks', { Name:r.name, 'Opening Balance':num(edit.opening), Notes:edit.subtypes }));
      } else {
        await updateRow('Reserves', r._row, rowValues('Reserves', { Reserve:r.name, Kind:r.kind, Unit:r.unit, 'Opening Balance':num(edit.opening), Subtypes:edit.subtypes, Notes:'' }));
      }
      setEditRes(null); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const addBank = async () => {
    const name = bank.name.trim();
    if (!name) { alert('Enter a bank/account name.'); return; }
    if (derived.reserves.some(r => r.name.toLowerCase() === name.toLowerCase())) { alert('A reserve with that name already exists.'); return; }
    setSaving(true);
    try {
      await appendRow('Banks', rowValues('Banks', { Name:name, 'Opening Balance':num(bank.opening), Notes:bank.notes }));
      setBank({ name:'', opening:'', notes:'' }); setShowAddBank(false); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const handleToggleOpenRes = (name) => {
    setOpenRes(o => o === name ? null : name);
    setShowAllTxns(false);
  };

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">🥇 Gold Reserve (combined)</div><div className="stat-value gold">{fmtG(derived.goldTotal)}</div><div className="stat-sub">Ornaments + Metal + Old Gold</div></div>
        <div className="stat-card"><div className="stat-label">🥈 Silver Reserve (combined)</div><div className="stat-value silver">{fmtG(derived.silverTotal)}</div><div className="stat-sub">Silver + Old Silver</div></div>
        <div className="stat-card"><div className="stat-label">💵 Cash</div><div className="stat-value green">{fmtINR(derived.cashBal)}</div><div className="stat-sub">In hand</div></div>
        <div className="stat-card"><div className="stat-label">🏦 Banks total</div><div className="stat-value green">{fmtINR(derived.bankTotal)}</div><div className="stat-sub">{derived.banks.length} account{derived.banks.length!==1?'s':''}</div></div>
      </div>

      <div className="section-row">
        <h3>Reserves</h3>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={()=>{setBank({name:'',opening:'',notes:''});setShowAddBank(o=>!o);}}>🏦 Add Bank Account</button>
          <button className="btn btn-primary" onClick={onNew}><Icon name="exchange" size={14}/> New Transaction</button>
        </div>
      </div>

      {showAddBank && <div className="card" style={{marginBottom:16}}>
        <div className="card-title">New Bank / Account Reserve</div>
        <div className="form-grid">
          <div className="form-group"><label>Account Name *</label><input placeholder="e.g. Ramkumar HDFC" value={bank.name} onChange={e=>setBank(p=>({...p,name:e.target.value}))}/></div>
          <div className="form-group"><label>Opening Balance (₹)</label><input type="number" value={bank.opening} onChange={e=>setBank(p=>({...p,opening:e.target.value}))}/></div>
          <div className="form-group"><label>Notes</label><input placeholder="Account no. / branch" value={bank.notes} onChange={e=>setBank(p=>({...p,notes:e.target.value}))}/></div>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={addBank} disabled={saving}>{saving?<span className="spinner"/>:'Add Account'}</button>
          <button className="btn btn-secondary" onClick={()=>setShowAddBank(false)}>Cancel</button>
        </div>
      </div>}

      <div className="gap-12">{derived.reserves.map(r => {
        const entries = data.entries.filter(e => e.Reserve===r.name).sort((a,b)=>(b.Date||'').localeCompare(a.Date||'') || (b.ID||'').localeCompare(a.ID||''));
        const isOpen = openRes===r.name;
        const displayedEntries = showAllTxns ? entries : entries.slice(0, 20);
        return (
        <div className="card" key={r.name} style={{padding:0,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',cursor:'pointer',flexWrap:'wrap',gap:8}} onClick={()=>handleToggleOpenRes(r.name)}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:36,height:36,borderRadius:8,background:'var(--accent-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{r.emoji}</div>
              <div>
                <div style={{fontWeight:600,fontSize:14}}>{r.name}</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:1}}>opening {fmtReserve(r.name, r.opening)} · {entries.length} entries{r.subtypes.length?` · ${r.subtypes.join(', ')}`:''}</div>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div className={`mono`} style={{fontSize:17,color:r.kind==='Silver'?'var(--silver)':r.kind==='Cash'?'var(--green)':'var(--gold)'}}>{fmtReserve(r.name, r.balance)}</div>
              <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation();startEdit(r);}}>✏️</button>
              <span style={{color:'var(--text-muted)',fontSize:20,transition:'transform .2s',display:'inline-block',transform:isOpen?'rotate(90deg)':'none'}}>›</span>
            </div>
          </div>

          {editRes===r.name && <div style={{borderTop:'1px solid var(--border)',padding:'14px 18px',background:'var(--navy)'}}>
            <div className="form-grid">
              <div className="form-group"><label>{r.isBank?'Opening Balance (₹)':`Manual Opening ${isCash(r.name)?'(₹)':'(g) — adds to box-tagged opening'}`}</label><input type="number" step="0.001" value={edit.opening} onChange={e=>setEdit(p=>({...p,opening:e.target.value}))}/></div>
              <div className="form-group" style={{gridColumn:'1/-1'}}><label>{r.isBank?'Notes':'Subtypes'} <span style={{color:'var(--text-muted)'}}>{r.isBank?'account no. / branch':'comma separated'}</span></label><input placeholder={r.isBank?'HDFC ••1234':'e.g. 22k, 24k, coins'} value={edit.subtypes} onChange={e=>setEdit(p=>({...p,subtypes:e.target.value}))}/></div>
            </div>
            {!isCash(r.name) && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>Box-tagged opening: {fmtG(r.stockOpening)} (from Stock). Total opening = box-tagged + manual.</div>}
            {r.isBank && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>Balance = opening + all In/Out entries for this account. (Account name can't be changed here — past entries reference it.)</div>}
            <div className="btn-row">
              <button className="btn btn-primary" onClick={()=>saveEdit(r)} disabled={saving}>{saving?<span className="spinner"/>:'Save'}</button>
              <button className="btn btn-secondary" onClick={()=>setEditRes(null)}>Cancel</button>
            </div>
          </div>}

          {isOpen && <div style={{borderTop:'1px solid var(--border)',padding:'12px 18px'}}>
            <div style={{display:'flex',gap:18,flexWrap:'wrap',fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>
              <span>Opening: <b className="mono">{fmtReserve(r.name, r.opening)}</b></span>
              <span>Net movement: <b className="mono" style={{color:r.moved>=0?'var(--green)':'var(--red)'}}>{r.moved>=0?'+':''}{fmtReserve(r.name, r.moved)}</b></span>
              <span>Balance: <b className="mono">{fmtReserve(r.name, r.balance)}</b></span>
            </div>
            {entries.length===0 ? <div style={{fontSize:12,color:'var(--text-muted)'}}>No movements yet.</div> : <>
            <div className="table-wrap"><table>
              <thead><tr><th>Date</th><th>Dir</th><th>Qty</th><th>Touch</th><th>Value</th><th>Type</th><th>Who</th><th>Notes</th></tr></thead>
              <tbody>{displayedEntries.map(e=>(
                <tr key={e.ID}>
                  <td className="mono">{e.Date}</td>
                  <td><span className={`badge ${e.Direction==='In'?'badge-green':'badge-red'}`}>{e.Direction==='In'?'↓ In':'↑ Out'}</span></td>
                  <td className="mono">{fmtReserve(r.name, e.Qty)}</td>
                  <td className="mono" style={{color:'var(--text-muted)'}}>{e.Touch?`${e.Touch}${num(e.Margin)?'+'+e.Margin:''}`:'—'}</td>
                  <td className="mono">{e.Value?fmtINR(e.Value):'—'}</td>
                  <td><span className="badge badge-secondary" style={{fontSize:11,textTransform:'capitalize'}}>{e.Category||'—'}</span></td>
                  <td>{e.Counterparty||'—'}</td>
                  <td style={{fontSize:12}}>{e.Notes||'—'}</td>
                </tr>
              ))}</tbody>
            </table></div>
            {entries.length > 20 && (
              <div style={{display:'flex', justifyContent:'center', marginTop:10}}>
                <button className="btn btn-secondary btn-sm" style={{display:'flex', alignItems:'center', gap:4}} onClick={() => setShowAllTxns(o => !o)}>
                  {showAllTxns ? (
                    <>Show Less <span style={{fontSize:10}}>▲</span></>
                  ) : (
                    <>Show All ({entries.length}) <span style={{fontSize:10}}>▼</span></>
                  )}
                </button>
              </div>
            )}
            </>}
          </div>}
        </div>);
      })}</div>
    </div>
  );
}

// ── EXPENSES — money out of Cash reserve ─────────────────────────────────────
function Expenses({ data, derived, onRefresh }) {
  const [saving, setSaving] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const cashNames = derived.reserves.filter(r => r.kind==='Cash').map(r => r.name);
  const [form, setForm] = useState({ date: todayStr(), reserve: 'Cash', amount: '', subtype: '', notes: '' });
  const f = (k,v)=>setForm(p=>({...p,[k]:v}));
  const expenses = data.entries.filter(e => isCash(e.Reserve) && e.Direction==='Out' && e.Category==='Expense')
    .sort((a,b)=>(b.Date||'').localeCompare(a.Date||''));

  const handleSave = async () => {
    if (num(form.amount)<=0) { alert('Enter the amount.'); return; }
    setSaving(true);
    try {
      if (editingExpense) {
        await updateRow('Entries', editingExpense._row, rowValues('Entries', {
          ...editingExpense,
          Date: form.date,
          Reserve: form.reserve,
          Subtype: form.subtype,
          Qty: num(form.amount),
          Value: num(form.amount),
          Notes: form.notes
        }));
        setEditingExpense(null);
      } else {
        await addEntry(uid('EX'), form.date, { reserve:form.reserve, subtype:form.subtype, direction:'Out', qty:num(form.amount), value:num(form.amount), category:'Expense', notes:form.notes });
      }
      setForm({ date: todayStr(), reserve: form.reserve, amount: '', subtype: '', notes: '' });
      onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const handleCancel = () => {
    setEditingExpense(null);
    setForm({ date: todayStr(), reserve: 'Cash', amount: '', subtype: '', notes: '' });
  };

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">💵 Cash Balance</div><div className={`stat-value ${derived.cashBal>=0?'green':'red'}`}>{fmtINR(derived.cashBal)}</div></div>
        <div className="stat-card"><div className="stat-label">🏦 Banks total</div><div className="stat-value green">{fmtINR(derived.bankTotal)}</div><div className="stat-sub">{derived.banks.length} account{derived.banks.length!==1?'s':''}</div></div>
        <div className="stat-card"><div className="stat-label">Total Expenses Logged</div><div className="stat-value gold">{fmtINR(expenses.reduce((s,e)=>s+num(e.Qty),0))}</div><div className="stat-sub">{expenses.length} entries</div></div>
      </div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-title">{editingExpense ? 'Edit Expense' : 'Record an Expense'}</div>
        <div className="form-grid">
          <div className="form-group"><label>Date</label><input type="date" value={form.date} onChange={e=>f('date',e.target.value)}/></div>
          <div className="form-group"><label>Paid From</label><select value={form.reserve} onChange={e=>f('reserve',e.target.value)}>{cashNames.map(n=><option key={n} value={n}>{n} ({fmtINR(derived.balOf(n))})</option>)}</select></div>
          <div className="form-group"><label>Amount (₹) *</label><input type="number" value={form.amount} onChange={e=>f('amount',e.target.value)}/></div>
          <div className="form-group"><label>Category</label><input placeholder="e.g. rent, salary, tea" value={form.subtype} onChange={e=>f('subtype',e.target.value)}/></div>
          <div className="form-group"><label>Notes</label><input value={form.notes} onChange={e=>f('notes',e.target.value)}/></div>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<span className="spinner"/>:editingExpense?'Update Expense':'Save Expense'}</button>
          {editingExpense && <button className="btn btn-secondary" onClick={handleCancel}>Cancel</button>}
        </div>
      </div>
      <div className="card">
        <div className="card-title">Recent Expenses</div>
        {expenses.length===0 ? <div className="empty"><p>No expenses recorded yet.</p></div> :
        <div className="table-wrap"><table>
          <thead><tr><th>Date</th><th>Paid From</th><th>Category</th><th>Amount</th><th>Notes</th><th style={{width: 90}}></th></tr></thead>
          <tbody>{expenses.slice(0,100).map(e=>(
            <tr key={e.ID}>
              <td className="mono">{e.Date}</td>
              <td>{e.Reserve}</td>
              <td>{e.Subtype||'—'}</td>
              <td className="mono" style={{color:'var(--red)'}}>−{fmtINR(e.Qty)}</td>
              <td style={{fontSize:12}}>{e.Notes||'—'}</td>
              <td>
                <div style={{display:'flex', gap: 6}}>
                  <button className="btn btn-secondary btn-sm" onClick={() => {
                    setForm({ date: e.Date, reserve: e.Reserve, amount: e.Qty, subtype: e.Subtype||'', notes: e.Notes||'' });
                    setEditingExpense(e);
                  }} title="Edit Expense">✏️</button>
                  <button className="btn btn-danger btn-sm" onClick={async () => {
                    if (window.confirm('Delete this expense entry?')) {
                      setSaving(true);
                      try {
                        await deleteRow('Entries', e._row);
                        onRefresh();
                      } catch(err) { alert('Error: ' + err.message); }
                      setSaving(false);
                    }
                  }} title="Delete Expense">🗑️</button>
                </div>
              </td>
            </tr>
          ))}</tbody>
        </table></div>}
      </div>
    </div>
  );
}

// ── REMINDERS ────────────────────────────────────────────────────────────────

  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ due: '', title:'', notes:'' });
  const f = (k,v)=>setForm(p=>({...p,[k]:v}));
  const [filter, setFilter] = useState('open');
  const all = [...data.reminders].sort((a,b)=>(a['Due Date']||'').localeCompare(b['Due Date']||''));

  const add = async () => {
    if (!form.title.trim()) { alert('Enter a title.'); return; }
    setSaving(true);
    try {
      await appendRow('Reminders', [uid('RM'), todayStr(), form.due, form.title.trim(), 'Standalone', '', 'Open', form.notes]);
      setForm({ due:'', title:'', notes:'' }); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };
  const toggle = async (r) => {
    setSaving(true);
    try { await updateRow('Reminders', r._row, rowValues('Reminders', { ...r, Status: r.Status==='Closed'?'Open':'Closed' })); onRefresh(); }

  return (

          <div className="form-group" style={{gridColumn:'1/-1'}}><label>Notes</label><input value={form.notes} onChange={e=>f('notes',e.target.value)}/></div>

          <button className={`tab ${filter==='closed'?'active':''}`} onClick={()=>setFilter('closed')}>Closed</button>
          <button className={`tab ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>All</button>

      <div className="card">
        {shown.length===0 ? <div className="empty"><p>Nothing here.</p></div> :
        <div className="gap-12">{shown.map(r => {

          const overdue = !closed && r['Due Date'] && r['Due Date'] < todayStr();
          return (<div key={r.ID} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,padding:'12px 14px',background:'var(--navy)',borderRadius:8,border:`1px solid ${overdue?'rgba(239,68,68,.3)':'var(--border)'}`}}>
            <div>
              <div style={{fontWeight:500,fontSize:13,textDecoration:closed?'line-through':'none',color:closed?'var(--text-muted)':'var(--text-primary)'}}>{r.Title}</div>
              <div style={{fontSize:11,color:overdue?'var(--red)':'var(--text-muted)',marginTop:2}}>{r['Due Date']?`Due ${r['Due Date']}`:'No date'}{overdue?' · overdue':''}{r['Linked Type']&&r['Linked Type']!=='Standalone'?` · ${r['Linked Type']}`:''}{r.Notes?` · ${r.Notes}`:''}</div>
            </div>
            <button className={`btn btn-sm ${closed?'btn-secondary':'btn-primary'}`} onClick={()=>toggle(r)} disabled={saving}>{closed?'Reopen':'✓ Close'}</button>

      </div>
    </div>
  );
}

// ── LENDING ──────────────────────────────────────────────────────────────────
const lendReserveOptions = (type, cashNames) => type==='Cash' ? (cashNames && cashNames.length ? cashNames : ['Cash']) : type==='Gold' ? ['Old Gold','Gold Metal','Ornaments','Own Use Gold'] : ['Old Silver','Silver'];

function Lending({ data, derived, onRefresh }) {
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [editingLend, setEditingLend] = useState(null);
  const cashNames = derived.reserves.filter(r => r.kind==='Cash').map(r => r.name);
  const blank = { date: todayStr(), person:'', phone:'', type:'Cash', reserve:'Cash', weight:'', amount:'', interest:'', due:'', notes:'' };
  const [form, setForm] = useState(blank);
  const f = (k,v) => setForm(p=>({...p,[k]:v}));
  const setType = (t) => setForm(p => ({ ...p, type:t, reserve: lendReserveOptions(t, cashNames)[0] }));

  const handleSave = async () => {
    if (!form.person.trim()) { alert('Person name required.'); return; }
    if (num(form.amount)<=0) { alert('Enter the ₹ value of what is given (even for gold, enter its value).'); return; }
    if (form.type!=='Cash' && num(form.weight)<=0) { alert('Enter the weight given.'); return; }
    const qty = form.type==='Cash' ? num(form.amount) : num(form.weight);
    
    let bal = derived.balOf(form.reserve);
    if (editingLend && editingLend.Reserve === form.reserve) {
      const origQty = editingLend.Type==='Cash' ? num(editingLend.Amount) : num(editingLend['Weight Grams']);
      bal += origQty;
    }
    
    if (qty > bal + (isCash(form.reserve)?0.5:0.001)) { alert(`"${form.reserve}" has only ${fmtReserve(form.reserve,bal)} — cannot lend ${fmtReserve(form.reserve,qty)}.`); return; }
    setSaving(true);
    try {
      if (editingLend) {
        // Update existing record
        await updateRow('Lending', editingLend._row, rowValues('Lending', {
          ID: editingLend.ID, Date: form.date, Person: form.person.trim(), Phone: form.phone, Type: form.type, Reserve: form.reserve,
          'Weight Grams': form.type==='Cash'?'':num(form.weight), Amount: num(form.amount), 'Interest %': num(form.interest),
          'Interest Type': num(form.interest)>0 ? 'Simple' : 'None', 'Due Date': form.due, Status: form.Status||'Open', Notes: form.notes,
        }));
        
        // Update corresponding ledger entry in Entries
        const entry = data.entries.find(e => e['Txn ID'] === editingLend.ID && e.Category === 'Lending');
        if (entry) {
          await updateRow('Entries', entry._row, rowValues('Entries', {
            ID: entry.ID, 'Txn ID': editingLend.ID, Date: form.date, Reserve: form.reserve, Subtype: '', Direction: 'Out', Qty: qty,
            'Weight Grams': form.type==='Cash'?'':form.weight, Touch: '', Margin: '', Value: num(form.amount),
            Counterparty: form.person.trim(), Category: 'Lending', Ref: editingLend.ID, Notes: `Lent to ${form.person.trim()}`
          }));
        }
        setEditingLend(null);
      } else {
        // Create new record
        const id = uid('LN');
        const interestType = num(form.interest)>0 ? 'Simple' : 'None';
        await appendRow('Lending', rowValues('Lending', {
          ID:id, Date:form.date, Person:form.person.trim(), Phone:form.phone, Type:form.type, Reserve:form.reserve,
          'Weight Grams': form.type==='Cash'?'':num(form.weight), Amount:num(form.amount), 'Interest %':num(form.interest),
          'Interest Type':interestType, 'Due Date':form.due, Status:'Open', Notes:form.notes,
        }));
        await addEntry(id, form.date, { reserve:form.reserve, direction:'Out', qty,
          weight: form.type==='Cash'?'':form.weight, value:num(form.amount), category:'Lending', ref:id,
          counterparty:form.person.trim(), notes:`Lent to ${form.person.trim()}` });
        if (form.due) {
          await appendRow('Reminders', [uid('RM'), todayStr(), form.due, `Lending return — ${form.person.trim()}`, 'Lending', id, 'Open', form.notes]);
        }
      }
      setForm(blank); setShowForm(false); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const openEdit = (l) => {
    setForm({
      ID: l.ID,
      date: l.Date,
      person: l.Person,
      phone: l.Phone || '',
      type: l.Type,
      reserve: l.Reserve,
      weight: l['Weight Grams'] || '',
      amount: l.Amount || '',
      interest: l['Interest %'] || '',
      due: l['Due Date'] || '',
      notes: l.Notes || '',
      Status: l.Status
    });
    setEditingLend(l);
    setShowForm(true);
  };

  const lends = [...derived.lendOutstanding].sort((a,b)=>(b.Date||'').localeCompare(a.Date||''));
  const open = lends.filter(l=>l.outstanding>.5);
  const closed = lends.filter(l=>l.outstanding<=.5);

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Outstanding to Collect</div><div className="stat-value gold">{fmtINR(derived.lendingDue)}</div><div className="stat-sub">{open.length} open lends · principal value</div></div>
      </div>
      <div className="section-row">
        <h3>Lending / Help Given</h3>
        <button className="btn btn-primary" onClick={()=>{setForm(blank);setEditingLend(null);setShowForm(o=>!o);}}><Icon name="plus" size={14}/> Give Cash / Gold</button>
      </div>

      {showForm && <div className="card" style={{marginBottom:16}}>
        <div className="card-title">{editingLend ? 'Edit Lending' : 'New Lending'}</div>
        <div className="form-grid">
          <div className="form-group"><label>Person *</label><input placeholder="Name" value={form.person} onChange={e=>f('person',e.target.value)}/></div>
          <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e=>f('phone',e.target.value)}/></div>
          <div className="form-group"><label>Date</label><input type="date" value={form.date} onChange={e=>f('date',e.target.value)}/></div>
          <div className="form-group"><label>What Given</label><select value={form.type} onChange={e=>setType(e.target.value)}><option>Cash</option><option>Gold</option><option>Silver</option></select></div>
          <div className="form-group"><label>From Reserve <span style={{color:'var(--text-muted)'}}>{fmtReserve(form.reserve, derived.balOf(form.reserve))} avail</span></label>
            <select value={form.reserve} onChange={e=>f('reserve',e.target.value)}>{lendReserveOptions(form.type, cashNames).map(n=><option key={n} value={n}>{n}</option>)}</select>
          </div>
          {form.type!=='Cash' && <div className="form-group"><label>Weight (g) *</label><input type="number" step="0.001" value={form.weight} onChange={e=>f('weight',e.target.value)}/></div>}
          <div className="form-group"><label>Value Given (₹) *</label><input type="number" placeholder="Principal value" value={form.amount} onChange={e=>f('amount',e.target.value)}/></div>
          <div className="form-group"><label>Interest % per month</label><input type="number" step="0.1" placeholder="0 = free help" value={form.interest} onChange={e=>f('interest',e.target.value)}/></div>
          <div className="form-group"><label>Return By (date)</label><input type="date" value={form.due} onChange={e=>f('due',e.target.value)}/></div>
          <div className="form-group" style={{gridColumn:'1/-1'}}><label>Notes</label><input placeholder="Reason / agreement" value={form.notes} onChange={e=>f('notes',e.target.value)}/></div>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<span className="spinner"/>:editingLend?'Update':'Save'}</button>
          <button className="btn btn-secondary" onClick={()=>{setShowForm(false);setEditingLend(null);}}>Cancel</button>
        </div>
      </div>}

      {open.length===0 && closed.length===0 ? <div className="card"><div className="empty"><p>Nothing lent out yet.</p></div></div> : <>
        {open.length>0 && <div className="gap-12" style={{marginBottom:16}}>{open.map(l=><LendCard key={l.ID} l={l} data={data} derived={derived} onRefresh={onRefresh} onEdit={openEdit}/>)}</div>}
        {closed.length>0 && <CollapsibleSection title={`✓ Closed / fully returned (${closed.length})`}>
          <div className="gap-12">{closed.map(l=><LendCard key={l.ID} l={l} data={data} derived={derived} onRefresh={onRefresh} onEdit={openEdit}/>)}</div>
        </CollapsibleSection>}
      </>}
    </div>
  );
}

function LendCard({ l, data, derived, onRefresh, onEdit }) {
  const [open, setOpen] = useState(false);
  const [showPay, setShowPay] = useState(false);
  const [saving, setSaving] = useState(false);
  const [editingPay, setEditingPay] = useState(null);
  const [pay, setPay] = useState({ date: todayStr(), mode: 'Cash', reserve: 'Cash', amount: '', weight: '', notes: '' });
  const payments = data.payments.filter(p=>p['Ref Type']==='Lending' && p['Ref ID']===l.ID);
  const overdue = l['Due Date'] && l.outstanding>.5 && l['Due Date'] < todayStr();

  const handlePay = async () => {
    const amt = num(pay.amount);
    if (amt<=0) { alert('Enter the ₹ value returned.'); return; }
    const metalReturn = pay.mode==='Gold'||pay.mode==='Silver';
    if (metalReturn && num(pay.weight)<=0) { alert('Enter the weight returned.'); return; }
    setSaving(true);
    try {
      const payId = uid('P');
      await appendRow('Payments', rowValues('Payments', { ID:payId, Date:pay.date, 'Ref Type':'Lending', 'Ref ID':l.ID, Person:l.Person, Mode:pay.mode, Amount:amt, 'Weight Grams':metalReturn?num(pay.weight):'', Notes:pay.notes }));
      await addEntry(l.ID, pay.date, { reserve:pay.reserve, direction:'In', qty: metalReturn?num(pay.weight):amt,
        weight: metalReturn?pay.weight:'', value:amt, category:'Lending Return', ref:payId, counterparty:l.Person, notes:`From ${l.Person} (${pay.mode})` });
      
      const newOutstanding = l.outstanding - amt;
      if (newOutstanding < .5 && l._row) {
        await updateRow('Lending', l._row, rowValues('Lending', { ...l, Status:'Closed' }));
      }
      setShowPay(false); 
      setPay({ date: todayStr(), mode: 'Cash', reserve: 'Cash', amount: '', weight: '', notes: '' });
      onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const handleUpdatePay = async () => {
    const amt = num(pay.amount);
    if (amt<=0) { alert('Enter the ₹ value returned.'); return; }
    const metalReturn = pay.mode==='Gold'||pay.mode==='Silver';
    if (metalReturn && num(pay.weight)<=0) { alert('Enter the weight returned.'); return; }
    setSaving(true);
    try {
      await updateRow('Payments', editingPay._row, rowValues('Payments', {
        ID: editingPay.ID, Date: pay.date, 'Ref Type': 'Lending', 'Ref ID': l.ID, Person: l.Person, Mode: pay.mode, Amount: amt, 'Weight Grams': metalReturn ? num(pay.weight) : '', Notes: pay.notes
      }));
      const entry = data.entries.find(e => e.Category === 'Lending Return' && (e.Ref === editingPay.ID || (e['Txn ID'] === l.ID && num(e.Qty) === num(editingPay.Amount))));
      if (entry) {
        await updateRow('Entries', entry._row, rowValues('Entries', {
          ID: entry.ID, 'Txn ID': l.ID, Date: pay.date, Reserve: pay.reserve, Subtype: '', Direction: 'In', Qty: metalReturn ? num(pay.weight) : amt,
          'Weight Grams': metalReturn ? pay.weight : '', Touch: '', Margin: '', Value: amt, Category: 'Lending Return', Ref: editingPay.ID, Counterparty: l.Person, Notes: `From ${l.Person} (${pay.mode})`
        }));
      }
      // Recalculate status of lending record
      const otherPaid = payments.filter(p => p.ID !== editingPay.ID).reduce((s, p) => s + num(p.Amount), 0);
      const newTotalPaid = otherPaid + amt;
      const newOutstanding = num(l.Amount) - newTotalPaid;
      const newStatus = newOutstanding <= 0.5 ? 'Closed' : 'Open';
      if (newStatus !== l.Status && l._row) {
        await updateRow('Lending', l._row, rowValues('Lending', { ...l, Status: newStatus }));
      }
      setShowPay(false);
      setEditingPay(null);
      setPay({ date: todayStr(), mode: 'Cash', reserve: 'Cash', amount: '', weight: '', notes: '' });
      onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  return (
    <div className="card" style={{padding:0,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',cursor:'pointer',flexWrap:'wrap',gap:8}} onClick={()=>setOpen(o=>!o)}>
        <div>
          <div style={{fontWeight:600,fontSize:14}}>{l.Person} <span style={{fontWeight:400,fontSize:12,color:'var(--text-muted)'}}>{l.Phone}</span></div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginTop:1}}>
            {l.Date} · gave {l.Type==='Cash'?fmtINR(l.Amount):`${l.Type} ${fmtG(l['Weight Grams'])} (worth ${fmtINR(l.Amount)})`}
            {l['Due Date'] && <> · return by <span style={{color:overdue?'var(--red)':'var(--text-secondary)'}}>{l['Due Date']}</span></>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {overdue && <span className="badge badge-red">Overdue</span>}
          <span className={`badge ${l.outstanding<=.5?'badge-green':'badge-gold'}`}>{l.outstanding<=.5?'Returned ✓':`To collect ${fmtINR(l.outstanding)}`}</span>
          <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation(); onEdit(l);}} title="Edit Lending Record">✏️</button>
          <span style={{color:'var(--text-muted)',fontSize:20,transition:'transform .2s',display:'inline-block',transform:open?'rotate(90deg)':'none'}}>›</span>
        </div>
      </div>

      {open && <div style={{borderTop:'1px solid var(--border)',padding:'14px 18px'}}>
        {l.Notes && <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>📝 {l.Notes}</div>}
        <div style={{display:'flex',gap:18,flexWrap:'wrap',marginBottom:12,fontSize:12,color:'var(--text-secondary)'}}>

// ── INVESTMENTS — bonds / FD / RD, funded from a reserve, repayments credited back
const INVEST_TYPES = ['FD','RD','Bond','Equity','US stocks','MF','Other'];

// Add n months to a YYYY-MM-DD string, clamping month overflow (Jan 31 → Feb 28).
function addMonths(dateStr, n) {
  if (!dateStr) return '';
  const [y,m,d] = String(dateStr).split('-').map(Number);
  const dt = new Date(y, m-1+n, d);
  if (dt.getDate() !== d) dt.setDate(0);
  const p = (x) => String(x).padStart(2,'0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
}

// Shared by the Investments page and the Dashboard highlights.
function investStats(data) {
  const all = data.investments || [];
  const active = all.filter(i => (i.Status||'Active') !== 'Closed');
  const totalPrincipal = active.reduce((s,i) => s+num(i.Principal), 0);
  const monthlyIncome = active.filter(i => i['Repayment Type']==='Monthly').reduce((s,i) => s+num(i['Monthly Repayment']), 0);
  const upcoming = active.filter(i => i['Next Payment Date'])
    .sort((a,b) => dateKey(a['Next Payment Date']).localeCompare(dateKey(b['Next Payment Date'])));
  const in60 = addMonths(todayStr(), 2);
  const maturing = active.filter(i => i['Maturity Date'] && dateKey(i['Maturity Date']) <= in60)
    .sort((a,b) => dateKey(a['Maturity Date']).localeCompare(dateKey(b['Maturity Date'])));
  return { all, active, totalPrincipal, monthlyIncome, upcoming, maturing };
}

function InvestCard({ inv, data, derived, onRefresh, onEdit }) {
  const [open, setOpen] = useState(false);
  const [showPay, setShowPay] = useState(false);
  const [saving, setSaving] = useState(false);
  const [pay, setPay] = useState({ date: todayStr(), reserve:'Cash', amount:'', isFinal:false, notes:'' });
  const [gen, setGen] = useState(null);       // schedule-generation panel state
  const [rowEdit, setRowEdit] = useState(null); // inline receive/edit of one schedule row
  const payments = data.payments.filter(p => p['Ref Type']==='Investment' && p['Ref ID']===inv.ID);
  const received = payments.reduce((s,p)=>s+num(p.Amount),0);
  const closed = (inv.Status||'Active')==='Closed';
  const nextDate = dateKey(inv['Next Payment Date']);
  const nextDue = !closed && nextDate && nextDate <= todayStr();
  const cashNames = derived.reserves.filter(r=>r.kind==='Cash').map(r=>r.name);

  const openPay = () => {
    setPay({ date: todayStr(), reserve: inv.Reserve && cashNames.includes(inv.Reserve) ? inv.Reserve : (cashNames[0]||'Cash'),
      amount: inv['Next Payment Value'] || inv['Monthly Repayment'] || '', isFinal:false, notes:'' });
    setShowPay(true);
  };

  const handlePay = async () => {
    const amt = num(pay.amount);
    if (amt<=0) { alert('Enter the amount received.'); return; }
    setSaving(true);
    try {
      const payId = uid('P');
      await appendRow('Payments', rowValues('Payments', { ID:payId, Date:pay.date, 'Ref Type':'Investment', 'Ref ID':inv.ID, Person:inv.Vendor||inv.Name, Mode:'Bank', Amount:amt, 'Weight Grams':'', Notes:pay.notes }));
      await addEntry(inv.ID, pay.date, { reserve:pay.reserve, direction:'In', qty:amt, value:amt,
        counterparty:inv.Vendor||inv.Name, category:'Investment Return', ref:payId, notes:`${pay.isFinal?'Final settlement':'Repayment'} — ${inv.Name}` });
      // Advance the schedule, or close out on final settlement.
      const upd = { ...inv };
      if (pay.isFinal) { upd.Status = 'Closed'; upd['Next Payment Date'] = ''; upd['Next Payment Value'] = ''; }
      else if ((inv['Repayment Type']||'')==='Monthly' && nextDate) { upd['Next Payment Date'] = addMonths(nextDate, 1); }
      await updateRow('Investments', inv._row, rowValues('Investments', upd));
      setShowPay(false); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  return (
    <div className="card" style={{padding:0,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',cursor:'pointer',flexWrap:'wrap',gap:8}} onClick={()=>setOpen(o=>!o)}>
        <div>
          <div style={{fontWeight:600,fontSize:14}}>{inv.Name} <span className="badge badge-blue" style={{marginLeft:6}}>{inv.Type}</span>{inv.Vendor && <span style={{fontWeight:400,fontSize:12,color:'var(--text-muted)',marginLeft:8}}>{inv.Vendor}</span>}</div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>
            {dateKey(inv['Start Date'])} · {fmtINR(inv.Principal)}{num(inv['Rate %'])>0?` @ ${inv['Rate %']}%`:''}
            {inv['Maturity Date'] && <> · matures {dateKey(inv['Maturity Date'])}</>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {nextDue && <span className="badge badge-red">Payment due</span>}
          {!closed && nextDate && !nextDue && <span className="badge badge-gold">Next {nextDate}{num(inv['Next Payment Value'])>0?` · ${fmtINR(inv['Next Payment Value'])}`:''}</span>}
          <span className={`badge ${closed?'badge-green':'badge-blue'}`}>{closed?'Closed ✓':'Active'}</span>
          <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation(); onEdit(inv);}} title="Edit Investment">✏️</button>
          <span style={{color:'var(--text-muted)',fontSize:20,transition:'transform .2s',display:'inline-block',transform:open?'rotate(90deg)':'none'}}>›</span>
        </div>
      </div>

      {open && <div style={{borderTop:'1px solid var(--border)',padding:'14px 18px'}}>
        {inv.Notes && <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>📝 {inv.Notes}</div>}
        <div style={{display:'flex',gap:18,flexWrap:'wrap',marginBottom:12,fontSize:12,color:'var(--text-secondary)'}}>
          <span>Principal: <b className="mono">{fmtINR(inv.Principal)}</b></span>
          <span>Received so far: <b className="mono" style={{color:'var(--green)'}}>{fmtINR(received)}</b></span>
          <span>Repayment: <b>{inv['Repayment Type']||'—'}{inv['Repayment Mode']?` (${inv['Repayment Mode']})`:''}{(inv['Repayment Type']||'')!=='At Maturity' && num(inv['Monthly Repayment'])>0?` · ${fmtINR(inv['Monthly Repayment'])}/period`:''}</b></span>
          {num(inv['Final Settlement'])>0 && <span>Final settlement: <b className="mono">{fmtINR(inv['Final Settlement'])}</b></span>}
          <span>Funded from: <b>{inv.Reserve||'—'}</b></span>
        </div>
        {payments.length>0 && <div className="table-wrap"><table>
          <thead><tr><th>Date</th><th>Amount</th><th>Notes</th></tr></thead>
          <tbody>{payments.map(p=>(
            <tr key={p.ID}><td className="mono">{dateKey(p.Date)}</td><td className="mono">{fmtINR(p.Amount)}</td><td>{p.Notes||'—'}</td></tr>
          ))}</tbody>
        </table></div>}

        {/* ── Repayment schedule — generated on demand, editable until maturity ── */}
        {(() => {
          const sched = (data.investSchedule||[]).filter(s => s['Investment ID']===inv.ID)
            .sort((a,b) => dateKey(a['Due Date']).localeCompare(dateKey(b['Due Date'])));
          const receivedCount = sched.filter(s => s.Status==='Received').length;
          const stepFor = (t) => t==='Quarterly' ? 3 : t==='Yearly' ? 12 : 1;

          // After any schedule change, point the investment's Next Payment at
          // the earliest still-planned period (rows = remaining planned rows).
          const syncNext = async (rows) => {
            const next = [...rows].sort((a,b) => a.date.localeCompare(b.date))[0];
            await updateRow('Investments', inv._row, rowValues('Investments', { ...inv, 'Next Payment Date': next ? next.date : '', 'Next Payment Value': next ? next.amount : '' }));
          };
          const remaining = (exceptId, patch) => sched
            .filter(s => s.Status!=='Received' && s.ID!==exceptId)
            .map(s => ({ date: dateKey(s['Due Date']), amount: num(s.Amount) }))
            .concat(patch ? [patch] : []);

          const openGen = () => setGen({
            first: dateKey(inv['Next Payment Date']) || addMonths(dateKey(inv['Start Date'])||todayStr(), stepFor(inv['Repayment Type'])),
            every: stepFor(inv['Repayment Type']),
            amount: num(inv['Monthly Repayment']) || num(inv['Next Payment Value']) || '',
            until: dateKey(inv['Maturity Date']) || '',
            rows: null,
          });
          const doPreview = () => {
            const every = Math.max(1, num(gen.every));
            if (!gen.first || !gen.until) { alert('Set the first repayment date and the until (maturity) date.'); return; }
            const rows = [];
            for (let i = 0; i < 120; i++) {
              const d = addMonths(gen.first, every*i);
              if (d > gen.until) break;
              rows.push({ key: uid('g'), date: d, amount: gen.amount });
            }
            if (rows.length===0) { alert('No periods fall between the first date and maturity.'); return; }
            setGen(g => ({ ...g, rows }));
          };
          const saveSchedule = async () => {

function NLPQuery({ data, derived }) {
  const [messages, setMessages] = useState([{role:'ai',text:'Ask me anything about your jewel stock, transactions, balances or lending. 💎'}]);
  const [input, setInput] = useState('');
  const [loading, setLoad] = useState(false);
  const endRef = useRef(null);

  const suggestions = [
    'What is my total gold reserve right now?',
    'Show the balance of every reserve',
    'How much cash do I have?',
    'What lending is overdue and how much interest has built up?',
    'What open reminders do I have?',
    'Show recent conversions',
  ];

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[messages]);

  const ask = async (q) => {
    if (!q.trim()||loading) return;
    setMessages(m=>[...m,{role:'user',text:q}]); setInput(''); setLoad(true);
    try {
      const answer = await askAI(q, data, derived);
      setMessages(m=>[...m,{role:'ai',text:answer}]);
    } catch(e) { setMessages(m=>[...m,{role:'ai',text:'Error: '+e.message}]); }
    setLoad(false);
  };

  return (
    <div>
      <div className="section-row"><h3>Ask a Question</h3><span style={{fontSize:12,color:'var(--text-muted)'}}>Claude or Gemini — set key in Setup</span></div>
      <div className="nlp-panel">
        <div className="nlp-messages">
          {messages.map((m,i)=>(
            <div className="msg" key={i}>
              <div className={`msg-avatar ${m.role}`}>{m.role==='user'?'You':'AI'}</div>
              <div className={`msg-bubble ${m.role}`} style={{whiteSpace:'pre-wrap'}}>{m.text}</div>
            </div>
          ))}
          {loading && <div className="msg"><div className="msg-avatar ai">AI</div><div className="msg-bubble" style={{color:'var(--text-muted)'}}>Thinking...</div></div>}
          <div ref={endRef}/>
        </div>
        <div className="nlp-suggestions">{suggestions.map(s=><button key={s} className="nlp-chip" onClick={()=>ask(s)}>{s}</button>)}</div>
        <div className="nlp-input-row">
          <textarea className="nlp-input" placeholder="Ask anything about your jewel business..." value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input);}}}
          />
          <button className="btn btn-primary" onClick={()=>ask(input)} disabled={loading||!input.trim()}><Icon name="send" size={14}/></button>
        </div>
      </div>
    </div>
  );
}

// Transliterate the tenant name & address to Tamil script and write the amount in Tamil words,
// using whichever AI key is configured. Returns { name, address, amountWords } or null if no key/failure.
async function tamilizeReceipt({ name, address, amount }) {
  const cfg = getConfig();
  const key = cfg.geminiKey || '';
  if (!key) return null;
  const instruction = `You write Tamil rent receipts. Convert the following to Tamil and reply with ONLY a strict JSON object, no markdown, no extra text.
Keys:
- "name": the person's name in Tamil script (transliterate the sounds; do not translate).
- "address": the address in Tamil script (transliterate proper nouns; translate common words like Street=தெரு, Road=சாலை, Nagar=நகர், House=வீடு, No=எண்).
- "amountWords": the number ${amount} written in Tamil words for rupees, ending with "ரூபாய் மட்டும்".
Input name: ${JSON.stringify(name||'')}
Input address: ${JSON.stringify(address||'')}`;
  const parse = (txt) => {
    try { const m = txt.match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : null; } catch { return null; }
  };
  try {
    const isClaude = key.startsWith('sk-ant-');
    if (isClaude) {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 500, messages: [{ role: 'user', content: instruction }] }),
      });
      if (!res.ok) return null;
      const d = await res.json();
      return parse(d.content?.[0]?.text || '');
    } else {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${key}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: instruction }] }], generationConfig: { maxOutputTokens: 500, responseMimeType: 'application/json' } }),
      });
      if (!res.ok) return null;
      const d = await res.json();
      return parse(d.candidates?.[0]?.content?.parts?.[0]?.text || '');
    }
  } catch { return null; }
}

                <div className="form-group"><label>Move-in Date</label><input type="date" value={form.tMoveIn} onChange={e=>f('tMoveIn',e.target.value)}/></div>
                <div className="form-group"><label>Last Rent Revision Date</label><input type="date" value={form.tLastRentRevision} onChange={e=>f('tLastRentRevision',e.target.value)}/></div>
                <div className="form-group"><label>Notes</label><input placeholder="Any notes" value={form.tNotes} onChange={e=>f('tNotes',e.target.value)}/></div>
              </div>
            </>
          )}

          <div className="btn-row">
            <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<><span className="spinner"/>&nbsp;Saving...</>:isEditing?'Update Property':'Save Property'}</button>
            <button className="btn btn-secondary" onClick={()=>setMode(null)}>Cancel</button>
          </div>
        </div>
      )}

      {data.properties.length === 0
        ? <div className="card"><div className="empty"><Icon name="home" size={40}/><p>No properties yet.</p></div></div>
        : <div className="gap-12">
            {data.properties.map(p => (
              <PropCard key={p.ID} p={p} data={data} onEdit={openEdit} onGoToRent={onGoToRent}/>
            ))}
          </div>
      }
    </div>
  );
}

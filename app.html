function Tenants({ data, derived, onRefresh }) {
  const [mode, setMode]     = useState(null);
  const [saving, setSaving] = useState(false);
  const [tab, setTab]       = useState('active');
  const cashNames = derived.reserves.filter(r => r.kind==='Cash').map(r => r.name);
  const blank = { 'Property ID':'', Name:'', Phone:'', Email:'', Advance:'', 'Move In Date':'', 'Last Rent Revision':'', Notes:'', advanceReserve: '' };
  const [form, setForm]     = useState(blank);
  const f = (k,v) => setForm(p => ({...p,[k]:v}));

  const openAdd  = () => { setForm(blank); setMode('add'); };
  const openEdit = (t) => {
    const existingEntry = data.entries.find(e => e['Txn ID'] === 'ADV-' + t.ID);
    setForm({
      ...blank,
      ...t,
      advanceReserve: existingEntry ? existingEntry.Reserve : ''
    });
    setMode({editing:t._row, id:t.ID});
  };

  const handleSave = async (withReceipt = false) => {
    if (!form['Property ID'] || !form.Name || !form.Phone) { alert('Property, name and phone required.'); return; }
    setSaving(true);
    try {
      const advAmt = num(form.Advance);
      const advRes = form.advanceReserve || '';

      if (mode === 'add') {
        const tenantId = `T${Date.now()}`;
        // vacate existing active tenant for this property
        for (const t of data.tenants.filter(t => t['Property ID'] === form['Property ID'] && t.Status === 'Active')) {
          await updateRow('Tenants', t._row, [t.ID, t['Property ID'], t.Name, t.Phone, t.Email, t.Advance, t['Move In Date'], 'Vacated', t.Notes, t['Last Rent Revision']||''], 10);
        }
        await appendRow('Tenants', [tenantId, form['Property ID'], form.Name, form.Phone, form.Email||'', form.Advance||'', form['Move In Date']||'', 'Active', form.Notes||'', form['Last Rent Revision']||'']);
        // mark property occupied
        const prop = data.properties.find(p => p.ID === form['Property ID']);
        if (prop) await updateRow('Properties', prop._row, [prop.ID, prop.Name, prop.Address, prop.Type, prop['Rent Amount'], 'Occupied', prop.Notes, prop.Created||''], 8);
        
        // credit advance to reserve if entered and reserve selected
        if (advAmt > 0 && advRes) {
          const advDate = form['Move In Date'] || todayStr();
          await addEntry('ADV-' + tenantId, advDate, {
            reserve: advRes,
            direction: 'In',
            qty: advAmt,
            value: advAmt,
            counterparty: form.Name,
            category: 'Rent',
            ref: tenantId,
            notes: `Advance for ${form.Name}`
          });
        }
      } else {
        await updateRow('Tenants', mode.editing, [mode.id, form['Property ID'], form.Name, form.Phone, form.Email||'', form.Advance||'', form['Move In Date']||'', form.Status||'Active', form.Notes||'', form['Last Rent Revision']||''], 10);
        
        // handle advance updates on edit
        const existingEntry = data.entries.find(e => e['Txn ID'] === 'ADV-' + mode.id);
        if (advAmt > 0 && advRes) {
          if (existingEntry) {
            await updateRow('Entries', existingEntry._row, rowValues('Entries', {
              ...existingEntry,
              Date: form['Move In Date'] || todayStr(),
              Reserve: advRes,
              Qty: advAmt,
              Value: advAmt,
              Counterparty: form.Name,
              Notes: `Advance for ${form.Name}`
            }));
          } else {
            const advDate = form['Move In Date'] || todayStr();
            await addEntry('ADV-' + mode.id, advDate, {
              reserve: advRes,
              direction: 'In',
              qty: advAmt,
              value: advAmt,
              counterparty: form.Name,
              category: 'Rent',
              ref: mode.id,
              notes: `Advance for ${form.Name}`
            });
          }
        } else if (existingEntry) {
          await deleteRow('Entries', existingEntry._row);
        }
      }
      setMode(null); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const filtered = data.tenants.filter(t => tab==='active' ? t.Status==='Active' : t.Status!=='Active');

  return (
    <div>
      <div className="section-row">
        <h3>Tenants</h3>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/> Add Tenant</button>
      </div>

      {mode !== null && (
        <div className="card" style={{marginBottom:20}}>
          <div className="card-title">{mode==='add'?'New Tenant':'Edit Tenant'}</div>
          {mode==='add' && <div style={{fontSize:12,color:'var(--gold)',marginBottom:12,padding:'8px 12px',background:'rgba(245,158,11,.08)',borderRadius:6,border:'1px solid rgba(245,158,11,.2)'}}>Existing active tenant for this property will be auto-vacated.</div>}
          <div className="form-grid">
            <div className="form-group"><label>Property *</label>
              <select value={form['Property ID']} onChange={e=>f('Property ID',e.target.value)}>
                <option value="">Select property</option>
                {data.properties.map(p=><option key={p.ID} value={p.ID}>{p.Name}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Tenant Name *</label><input placeholder="Full name" value={form.Name} onChange={e=>f('Name',e.target.value)}/></div>
            <div className="form-group"><label>Phone *</label><input placeholder="9876543210" value={form.Phone} onChange={e=>f('Phone',e.target.value)}/></div>
            <div className="form-group"><label>Email</label><input placeholder="email@example.com" value={form.Email} onChange={e=>f('Email',e.target.value)}/></div>
            <div className="form-group"><label>Advance (₹)</label><input type="number" placeholder="50000" value={form.Advance} onChange={e=>f('Advance',e.target.value)}/></div>
            {num(form.Advance) > 0 && (
              <div className="form-group"><label>Credit Advance To</label>
                <select value={form.advanceReserve} onChange={e=>f('advanceReserve',e.target.value)}>
                  <option value="">Do not credit / Unaccounted</option>
                  {cashNames.map(n=><option key={n} value={n}>{n} ({fmtINR(derived.balOf(n))})</option>)}
                </select>
              </div>
            )}
            <div className="form-group"><label>Move-in Date</label><input type="date" value={form['Move In Date']} onChange={e=>f('Move In Date',e.target.value)}/></div>
            <div className="form-group"><label>Last Rent Revision Date</label><input type="date" value={form['Last Rent Revision']} onChange={e=>f('Last Rent Revision',e.target.value)}/></div>
            {mode!=='add' && <div className="form-group"><label>Status</label>
              <select value={form.Status||'Active'} onChange={e=>f('Status',e.target.value)}>
                <option>Active</option><option>Vacated</option>
              </select>
            </div>}
            <div className="form-group" style={{gridColumn:'1/-1'}}><label>Notes</label><input placeholder="Any notes" value={form.Notes} onChange={e=>f('Notes',e.target.value)}/></div>
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?<><span className="spinner"/>&nbsp;Saving...</>:mode==='add'?'Save Tenant':'Update Tenant'}</button>
            <button className="btn btn-secondary" onClick={()=>setMode(null)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="tabs">
        <button className={`tab ${tab==='active'?'active':''}`} onClick={()=>setTab('active')}>Active ({data.tenants.filter(t=>t.Status==='Active').length})</button>
        <button className={`tab ${tab==='past'?'active':''}`} onClick={()=>setTab('past')}>Past ({data.tenants.filter(t=>t.Status!=='Active').length})</button>
      </div>

      <div className="card">
        {filtered.length===0 ? <div className="empty"><p>No {tab} tenants.</p></div> :
        <div className="table-wrap"><table>
          <thead><tr><th>Name</th><th>Property</th><th>Phone</th><th>Advance</th><th>Move-in</th><th>Last Rent Revision</th><th>Last Rent Paid</th><th>Status</th><th></th></tr></thead>
          <tbody>{filtered.map(t => {
            const prop = data.properties.find(p => p.ID === t['Property ID']);
            const lastPaidRent = data.rent.filter(r=>r['Property ID']===t['Property ID']&&r.Status==='Paid').sort((a,b)=>{const ya=Number(a.Year),yb=Number(b.Year);if(ya!==yb)return yb-ya;return MONTHS.indexOf(b.Month)-MONTHS.indexOf(a.Month);})[0];
            return (<tr key={t.ID}>
              <td className="name">{t.Name}</td>
              <td>{prop?prop.Name:t['Property ID']}</td>
              <td className="mono">{t.Phone}</td>
              <td className="mono">{fmtINR(t.Advance)}</td>
              <td style={{color:'var(--text-muted)'}}>{t['Move In Date']}</td>
              <td style={{color: t['Last Rent Revision'] ? 'var(--gold)' : 'var(--text-muted)'}}>{t['Last Rent Revision']||'—'}</td>
              <td style={{color: lastPaidRent ? 'var(--green)' : 'var(--text-muted)',fontWeight: lastPaidRent?600:400}}>{lastPaidRent ? `${lastPaidRent.Month} ${lastPaidRent.Year}` : '—'}</td>
              <td><span className={`badge ${t.Status==='Active'?'badge-green':'badge-gold'}`}>{t.Status}</span></td>
              <td><EditBtn onClick={()=>openEdit(t)}/></td>
            </tr>);
          })}</tbody>
        </table></div>}
      </div>
    </div>
  );
}

function ReceiptModal({ receipt, onClose }) {
  const receiptRef = useRef();
  const [generating, setGenerating] = useState(false);
  const [showEdit, setShowEdit] = useState(false);

  const recNum = receipt.receiptId || ('REC' + Math.floor(10000000 + Math.random()*90000000));
  const now    = new Date();
  const genTime = now.toLocaleDateString('en-IN') + ' at ' + now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const amountStr = Number(receipt.totalAmount).toLocaleString('en-IN');

  const monthLabelTa = receipt.months.length === 1
    ? `${taMonth(receipt.months[0].month)} ${receipt.months[0].year}`
    : `${taMonth(receipt.months[0].month)} ${receipt.months[0].year} முதல் ${taMonth(receipt.months[receipt.months.length-1].month)} ${receipt.months[receipt.months.length-1].year} வரை`;

  // Tamil name / address / amount-in-words — auto-filled by AI (falls back to English/blank), editable.
  const [ta, setTa] = useState({ name: receipt.tenantName || '', address: receipt.address || '', amountWords: '' });
  const [taState, setTaState] = useState('idle'); // idle | loading | done | error

  const runTamilize = async () => {
    setTaState('loading');
    const res = await tamilizeReceipt({ name: receipt.tenantName, address: receipt.address, amount: receipt.totalAmount });
    if (res && (res.name || res.address || res.amountWords)) {
      setTa(p => ({ name: res.name || p.name, address: res.address || p.address, amountWords: res.amountWords || p.amountWords }));
      setTaState('done');
    } else { setTaState(getConfig().geminiKey ? 'error' : 'nokey'); }
  };
  useEffect(() => { runTamilize(); }, []); // eslint-disable-line

  const captureAndShare = async () => {
    setGenerating(true);
    try {
      const canvas = await html2canvas(receiptRef.current, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        // Open image in new tab for saving / sharing
        const imgWin = window.open('', '_blank');
        imgWin.document.write(`
          <html><head><title>Rent Receipt</title>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <style>body{margin:0;background:#f3f4f6;display:flex;flex-direction:column;align-items:center;padding:16px;font-family:sans-serif;}
          img{max-width:100%;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.15);}
          .bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
          .btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
          .wa{background:#25d366;color:#fff;}.dl{background:#2563eb;color:#fff;}</style></head>
          <body>
          <div class="bar">
            <button class="btn wa" onclick="openWA()">📲 Send on WhatsApp</button>
            <button class="btn dl" onclick="dl()">⬇️ Download Image</button>
          </div>
          <img id="img" src="${url}"/>
          <script>
            const phone='${receipt.phone}'.replace(/\\D/g,'');
            const intlPhone=phone.startsWith('91')?phone:'91'+phone;
            function openWA(){
              const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
              const waUrl=isMobile
                ?'whatsapp://send?phone='+intlPhone
                :'https://web.whatsapp.com/send?phone='+intlPhone;
              window.open(waUrl,'_blank');
              alert('WhatsApp opened!\\n\\nSteps:\\n1. Download the image below\\n2. Attach it in the WhatsApp chat');
            }
            function dl(){
              const a=document.createElement('a');
              a.href='${url}';
              a.download='rent-receipt-${receipt.tenantName.replace(/\\s+/g,'-')}.png';
              a.click();
            }
          <\/script></body></html>`);
        imgWin.document.close();
        setGenerating(false);
      }, 'image/png');
    } catch(e) { alert('Error generating receipt: '+e.message); setGenerating(false); }
  };

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        {/* Editable Tamil details (not part of the captured image) */}
        <div style={{padding:'14px 14px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontSize:13,fontWeight:600,color:'#374151'}}>
              பெயர் & முகவரி (தமிழில்) {taState==='loading' && <span style={{color:'#6b7280',fontWeight:400}}>· மொழிபெயர்க்கிறது…</span>}
              {taState==='nokey' && <span style={{color:'#b45309',fontWeight:400,fontSize:11}}> · AI key இல்லை — கீழே தட்டச்சு செய்யவும்</span>}
              {taState==='error' && <span style={{color:'#b91c1c',fontWeight:400,fontSize:11}}> · மொழிபெயர்ப்பு தோல்வி — கைமுறையாக திருத்தவும்</span>}
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-secondary btn-sm" onClick={runTamilize} disabled={taState==='loading'}>🔁 மீண்டும்</button>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowEdit(o=>!o)}>{showEdit?'மறை':'✎ திருத்து'}</button>
            </div>

          {showEdit && <div className="ta-edit">
            <label>பெயர் (Name in Tamil)</label>

            <label>முகவரி (Address in Tamil)</label>
            <input value={ta.address} onChange={e=>setTa(p=>({...p,address:e.target.value}))} placeholder="முகவரி"/>
            <label>தொகை எழுத்தில் (Amount in words)</label>
            <input value={ta.amountWords} onChange={e=>setTa(p=>({...p,amountWords:e.target.value}))} placeholder="எ.கா. பதினைந்து ஆயிரம் ரூபாய் மட்டும்"/>
            <div className="ta-note">இந்த விவரங்கள் கீழே உள்ள ரசீதில் நிரப்பப்படும்.</div>
          </div>}
        </div>

        {/* Tamil book-style receipt — captured as image */}
        <div style={{padding:'8px 14px 0'}}>
        <div ref={receiptRef} className="ta-receipt">
          <div className="ta-head">
            <div className="t1">வாடகை ரசீது</div>
            <div className="t2">RENT RECEIPT</div>
          </div>
          <hr className="ta-hr"/>
          <div className="ta-meta">
            <span>ரசீது எண்: <b>{recNum}</b></span>
            <span>தேதி: <b>{receipt.paidDate || genTime.split(' at ')[0]}</b></span>
          </div>
          <hr className="ta-hr-dot"/>
          <div className="ta-body">
            <div>திரு / திருமதி <span className="ta-fill">{ta.name || '—'}</span> அவர்களிடமிருந்து,</div>
            <div><span className="ta-fill">{ta.address || '—'}</span> என்ற முகவரியில் உள்ள வீடு / கடையின்</div>
            <div><span className="ta-fill">{monthLabelTa}</span> மாதத்திற்கான வாடகைத் தொகையாக,</div>
            <div>ரூ. <span className="ta-amt">₹ {amountStr}</span> {ta.amountWords ? <>( <span className="ta-fill">{ta.amountWords}</span> )</> : null}</div>
            <div><span className="ta-fill">{taMethod(receipt.paymentMethod)}</span> மூலம் பெறப்பட்டது.</div>
          </div>
          <hr className="ta-hr-dot"/>
          <div className="ta-sign">
            <div>நன்றி 🙏</div>
            <div className="line"><div className="rule"/>பெற்றவர் கையொப்பம்</div>
          </div>
          <div className="ta-foot">ரசீது #{recNum} · உருவாக்கப்பட்டது {genTime}</div>
        </div>
        </div>

        <div className="modal-actions">
          <button className="btn btn-primary" style={{flex:1,justifyContent:'center',background:'#25d366'}} onClick={captureAndShare} disabled={generating}>
            {generating ? <><span className="spinner"/>&nbsp;உருவாக்குகிறது...</> : '📲 ரசீது உருவாக்கி WhatsApp அனுப்பு'}
          </button>
          <button className="btn btn-secondary" onClick={onClose}>மூடு</button>
        </div>
      </div>
    </div>
  );
}

// ── RENT ─────────────────────────────────────────────────────────────────────
function Rent({ data, derived, onRefresh, initialPropId, onClearTarget }) {
  const [mode, setMode]      = useState(null);
  const [saving, setSaving]  = useState(false);
  const [receipt, setReceipt]= useState(null);
  const cashReserves = (derived?.reserves || []).filter(r => r.kind === 'Cash').map(r => r.name);
  const [viewTab, setViewTab]= useState(initialPropId ? 'property' : 'month');
  const [filterProp, setFilterProp] = useState(initialPropId || '');

  useEffect(() => {
    if (initialPropId) { setViewTab('property'); setFilterProp(initialPropId); onClearTarget&&onClearTarget(); }
  }, [initialPropId]);
  const [filterMonth, setFM] = useState(new Date(new Date().getFullYear(), new Date().getMonth()-1, 1).toLocaleString('en-IN',{month:'long'}));
  const [filterYear,  setFY] = useState(String(new Date(new Date().getFullYear(), new Date().getMonth()-1, 1).getFullYear()));
  const [showNotPaid, setShowNotPaid] = useState(true);
  const [showPaid, setShowPaid] = useState(true);

  const _now       = new Date();
  const _lastMonth = new Date(_now.getFullYear(), _now.getMonth() - 1, 1);
  const curMonth   = _lastMonth.toLocaleString('en-IN',{month:'long'});
  const curYear    = String(_lastMonth.getFullYear());

  // blank form — selectedMonths is array of {month, year}
  const blank = {
    'Property ID':'', selectedMonths:[], perMonthAmount:'',
    totalAmount:'', 'Paid Date': new Date().toISOString().split('T')[0],
    Status:'Paid', paymentMethod:'Cash', receivedReserve:'Cash', Notes:''
  };
  const [form, setForm] = useState(blank);
  const f = (k,v) => setForm(p=>({...p,[k]:v}));

  // For edit — single month mode
  const blankEdit = { 'Property ID':'', Month:curMonth, Year:curYear, Amount:'', 'Paid Date': new Date().toISOString().split('T')[0], Status:'Paid', paymentMethod:'Cash', Notes:'' };
  const [editForm, setEditForm] = useState(blankEdit);
  const ef = (k,v) => setEditForm(p=>({...p,[k]:v}));

  const openAdd  = () => { setForm(blank); setMode('add'); };
  const openEdit = (r) => { setEditForm({...blankEdit,...r, paymentMethod: r.paymentMethod||'Cash'}); setMode({editing:r._row, id:r.ID}); };

  // Toggle month selection in grid
  const toggleMonth = (month, year) => {
    const key = `${month}|${year}`;
    const exists = form.selectedMonths.find(m => `${m.month}|${m.year}` === key);
    let updated;
    if (exists) {
      updated = form.selectedMonths.filter(m => `${m.month}|${m.year}` !== key);
    } else {
      updated = [...form.selectedMonths, {month, year}];
    }
    const total = updated.length * Number(form.perMonthAmount||0);
    setForm(p=>({...p, selectedMonths:updated, totalAmount: total||''}));
  };

  const handleSave = async (withReceipt = false) => {
    if (!form['Property ID'] || form.selectedMonths.length===0 || !form.perMonthAmount) {
      alert('Select property, at least one month, and per-month amount.'); return;
    }
    const _prop = data.properties.find(p=>p.ID===form['Property ID']);
    const _rentAmt = Number(_prop?.['Rent Amount']||0);
    if (_rentAmt > 0) {
      for (const {month, year} of form.selectedMonths) {
        const alreadyPaid = data.rent
          .filter(r=>r['Property ID']===form['Property ID']&&r.Month===month&&String(r.Year)===String(year)&&(r.Status==='Paid'||r.Status==='Partial'))
          .reduce((s,r)=>s+Number(r.Amount||0),0);
        const remaining = _rentAmt - alreadyPaid;
        if (Number(form.perMonthAmount) > remaining) {
          alert(`Cannot exceed rent for ${month} ${year}.\nRent: ₹${_rentAmt.toLocaleString('en-IN')}\nAlready recorded: ₹${alreadyPaid.toLocaleString('en-IN')}\nMax you can add: ₹${Math.max(0,remaining).toLocaleString('en-IN')}`);
          return;
        }
      }
    }
    setSaving(true);
    try {
      const tenant = data.tenants.find(t => t['Property ID']===form['Property ID'] && t.Status==='Active');
      const collecting = (form.Status==='Paid' || form.Status==='Partial') && num(form.perMonthAmount) > 0;
      // Create one row per month, and post the received money into the chosen reserve
      for (const {month, year} of form.selectedMonths) {
        const rentId = `R${Date.now()}${Math.random().toString(36).slice(2,5)}`;
        await appendRow('Rent', [
          rentId, form['Property ID'], tenant?.ID||'', month, year,
          form.perMonthAmount, form['Paid Date'], form.Status,
          form.Notes + (form.selectedMonths.length>1 ? ` [Bulk payment: ${form.selectedMonths.length} months]` : ''),
          form.paymentMethod||'Cash', collecting ? form.receivedReserve : ''
        ]);
        if (collecting) {
          await addEntry('RENT-'+rentId, form['Paid Date'], {
            reserve: form.receivedReserve, direction: 'In', qty: num(form.perMonthAmount), value: num(form.perMonthAmount),
            counterparty: tenant?.Name || '', category: 'Rent', ref: rentId, notes: `Rent ${month} ${year}`,
          });
        }
      }
      // Prepare receipt data
      const prop = data.properties.find(p=>p.ID===form['Property ID']);
      const receiptData = {
        receiptId: `R${Date.now()}`,
        tenantName: tenant?.Name || 'Tenant',
        phone: tenant?.Phone || '',
        address: prop?.Address || prop?.Name || '',
        months: form.selectedMonths,
        paidDate: new Date(form['Paid Date']).toLocaleDateString('en-IN'),
        paymentMethod: form.paymentMethod,
        totalAmount: form.totalAmount || (form.selectedMonths.length * Number(form.perMonthAmount)),
        perMonthAmount: form.perMonthAmount,
      };
      setMode(null);
      onRefresh();
      if (withReceipt) setReceipt(receiptData);
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const handleEditSave = async () => {
    if (!editForm['Property ID']||!editForm.Amount) { alert('Property and amount required.'); return; }
    const _eProp = data.properties.find(p=>p.ID===editForm['Property ID']);
    const _eRentAmt = Number(_eProp?.['Rent Amount']||0);
    if (_eRentAmt > 0) {
      const alreadyPaid = data.rent
        .filter(r=>r['Property ID']===editForm['Property ID']&&r.Month===editForm.Month&&String(r.Year)===String(editForm.Year)&&r.ID!==mode.id&&(r.Status==='Paid'||r.Status==='Partial'))
        .reduce((s,r)=>s+Number(r.Amount||0),0);
      const remaining = _eRentAmt - alreadyPaid;
      if (Number(editForm.Amount) > remaining) {
        alert(`Cannot exceed rent for ${editForm.Month} ${editForm.Year}.\nRent: ₹${_eRentAmt.toLocaleString('en-IN')}\nOther entries: ₹${alreadyPaid.toLocaleString('en-IN')}\nMax allowed: ₹${Math.max(0,remaining).toLocaleString('en-IN')}`);
        return;
      }
    }
    setSaving(true);
    try {
      const tenant = data.tenants.find(t=>t['Property ID']===editForm['Property ID']&&t.Status==='Active');
      await updateRow('Rent', mode.editing, [mode.id, editForm['Property ID'], tenant?.ID||'', editForm.Month, editForm.Year, editForm.Amount, editForm['Paid Date'], editForm.Status, editForm.Notes, editForm.paymentMethod||'Cash'], 10);
      setMode(null); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const showReceiptForRow = (r) => {
    const prop   = data.properties.find(p=>p.ID===r['Property ID']);
    const tenant = data.tenants.find(t=>t.ID===r['Tenant ID']) || data.tenants.find(t=>t['Property ID']===r['Property ID']&&t.Status==='Active');
    setReceipt({
      receiptId: r.ID,
      tenantName: tenant?.Name||'Tenant',
      phone: tenant?.Phone||'',
      address: prop?.Address||prop?.Name||'',
      months: [{month:r.Month, year:r.Year}],
      paidDate: r['Paid Date']||new Date().toLocaleDateString('en-IN'),
      paymentMethod: r['Payment Method']||r.paymentMethod||'Cash',
      totalAmount: r.Amount,
      perMonthAmount: r.Amount,
    });
  };

  // Build 12-month rolling grid for current+past year
  const monthGrid = [];
  for (const yr of [String(Number(curYear)-1), curYear]) {
    for (const mo of MONTHS) { monthGrid.push({month:mo, year:yr}); }
  }

  const filtered = data.rent.filter(r=>r.Month===filterMonth && String(r.Year)===filterYear);
  const total    = filtered.filter(r=>r.Status==='Paid').reduce((s,r)=>s+Number(r.Amount||0),0);

  // Who hasn't paid (fully) for the selected month — with tenant & history detail.
  const paidSums = {};
  filtered.filter(r=>r.Status==='Paid'||r.Status==='Partial').forEach(r=>{ paidSums[r['Property ID']] = (paidSums[r['Property ID']]||0) + Number(r.Amount||0); });
  const notPaid = data.properties
    .filter(p=>p.Occupancy!=='Vacant'&&p.Occupancy!=='NotApplicable'&&p.Occupancy!=='OwnUsage')
    .map(p=>{
      const due = Number(p['Rent Amount']||0), got = paidSums[p.ID]||0;
      return { p, due, got, pending: Math.max(0, due-got),
        tenant: data.tenants.find(t=>t['Property ID']===p.ID&&t.Status==='Active'),
        lastPaid: data.rent.filter(r=>r['Property ID']===p.ID&&r.Status==='Paid').sort((a,b)=>{const ya=Number(a.Year),yb=Number(b.Year);if(ya!==yb)return yb-ya;return MONTHS.indexOf(b.Month)-MONTHS.indexOf(a.Month);})[0] };
    })
    .filter(x => x.due>0 ? x.got < x.due - 0.5 : x.got <= 0);
  const totalPending = notPaid.reduce((s,x)=>s+(x.pending||x.due),0);

  // Jump to the Property View of one property (used by property-name links).
  const goProp = (id) => { setFilterProp(id); setViewTab('property'); };
  const propLink = (id, label) => <span style={{color:'var(--accent)',cursor:'pointer',textDecoration:'underline',textUnderlineOffset:3}} title="Open property view" onClick={e=>{e.stopPropagation(); goProp(id);}}>{label}</span>;
  // Record Rent prefilled for one property (from the not-paid cards).
  const openAddFor = (propId) => {
    const prop = data.properties.find(p=>p.ID===propId);
    setForm({ ...blank, 'Property ID':propId, perMonthAmount: prop?.['Rent Amount']||'', selectedMonths:[{month:filterMonth, year:filterYear}], totalAmount: Number(prop?.['Rent Amount']||0)||'' });
    setMode('add');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <div>
      {receipt && <ReceiptModal receipt={receipt} onClose={()=>setReceipt(null)}/>}

      <div className="section-row">
        <h3>Rent</h3>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/> Record Rent</button>
      </div>

      {/* ADD FORM — multi-month */}
      {mode==='add' && (
        <div className="card" style={{marginBottom:20}}>
          <div className="card-title">Record Rent Payment</div>
          <div className="form-grid">
            <div className="form-group"><label>Property *</label>
              <select value={form['Property ID']} onChange={e=>{
                const prop=data.properties.find(p=>p.ID===e.target.value);
                const amt = prop?.['Rent Amount']||'';
                const total2 = form.selectedMonths.length * Number(amt);
                setForm(p=>({...p,'Property ID':e.target.value, perMonthAmount:amt, totalAmount:total2||''}));
              }}>
                <option value="">Select property</option>
                {data.properties.map(p=><option key={p.ID} value={p.ID}>{p.Name}</option>)}
              </select>
              {/* Tenant confirmation strip */}
              {form['Property ID'] && (()=>{
                const t = data.tenants.find(t=>t['Property ID']===form['Property ID']&&t.Status==='Active');
                return t
                  ? <div style={{marginTop:6,padding:'8px 12px',background:'var(--green-light)',border:'1px solid rgba(16,185,129,.25)',borderRadius:6,display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}>
                      <span style={{fontSize:12,fontWeight:600,color:'var(--green)'}}>✓ Active Tenant</span>
                      <span style={{fontSize:13,fontWeight:500,color:'var(--text-primary)'}}>{t.Name}</span>
                      <span className="mono" style={{fontSize:13,color:'var(--text-secondary)'}}>{t.Phone}</span>
                    </div>
                  : <div style={{marginTop:6,padding:'8px 12px',background:'var(--red-light)',border:'1px solid rgba(239,68,68,.2)',borderRadius:6,fontSize:12,color:'var(--red)'}}>
                      ⚠️ No active tenant for this property
                    </div>;
              })()}
            </div>
            <div className="form-group"><label>Per Month Amount (₹) *</label>
              <input type="number" value={form.perMonthAmount} onChange={e=>{
                const amt=e.target.value;
                const total2=form.selectedMonths.length*Number(amt||0);
                setForm(p=>({...p,perMonthAmount:amt,totalAmount:total2||''}));
              }}/>
            </div>
            <div className="form-group"><label>Paid Date</label><input type="date" value={form['Paid Date']} onChange={e=>f('Paid Date',e.target.value)}/></div>
            <div className="form-group"><label>Status</label>
              <select value={form.Status} onChange={e=>f('Status',e.target.value)}><option>Paid</option><option>Partial</option><option>Pending</option></select>
            </div>
            <div className="form-group"><label>Payment Method</label>
              <select value={form.paymentMethod} onChange={e=>f('paymentMethod',e.target.value)}>
                <option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Other</option>
              </select>
            </div>
            <div className="form-group"><label>Received Into <span style={{color:'var(--text-muted)'}}>reserve</span></label>
              <select value={form.receivedReserve} onChange={e=>f('receivedReserve',e.target.value)}>
                {cashReserves.map(n=><option key={n} value={n}>{n}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Notes</label><input placeholder="Optional notes" value={form.Notes} onChange={e=>f('Notes',e.target.value)}/></div>
          </div>

          {/* Month selector grid */}
          <div style={{marginTop:16}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>
              Select Month(s) * &nbsp;
              <span style={{fontWeight:400,color:'var(--text-muted)'}}>— tap multiple for bulk payment</span>
            </div>
            {(()=>{
              const _gProp = data.properties.find(p=>p.ID===form['Property ID']);
              const _gRent = Number(_gProp?.['Rent Amount']||0);
              const _paidMap = {};
              if (form['Property ID']) {
                data.rent.filter(r=>r['Property ID']===form['Property ID']&&(r.Status==='Paid'||r.Status==='Partial'))
                  .forEach(r=>{const k=`${r.Month}|${r.Year}`;_paidMap[k]=(_paidMap[k]||0)+Number(r.Amount||0);});
              }
              return <>
                <div className="month-year-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  {[String(Number(curYear)-1), curYear].map(yr=>(
                    <div key={yr}>
                      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6,fontWeight:600}}>{yr}</div>
                      <div className="month-grid">
                        {MONTHS.map(mo=>{
                          const sel=form.selectedMonths.find(m=>m.month===mo&&m.year===yr);
                          const paid=_paidMap[`${mo}|${yr}`]||0;
                          const isFull=_gRent>0&&paid>=_gRent;
                          const isPartial=_gRent>0&&paid>0&&paid<_gRent;
                          return <div key={mo}
                            className={`month-chip ${sel?'selected':''}`}
                            style={isFull?{opacity:.55,cursor:'not-allowed',background:'rgba(16,185,129,.12)',border:'1px solid var(--green)'}:isPartial?{border:'1px solid var(--gold)'}:{}}
                            title={paid>0?`Paid: ₹${paid.toLocaleString('en-IN')}${_gRent?` | Remaining: ₹${Math.max(0,_gRent-paid).toLocaleString('en-IN')}`:''}`:''}
                            onClick={()=>!isFull&&toggleMonth(mo,yr)}>
                            <span>{mo.slice(0,3)}</span>
                            {isPartial&&<span style={{display:'block',fontSize:8,lineHeight:1.2,color:'var(--gold)',marginTop:1}}>partial</span>}
                            {isFull&&<span style={{display:'block',fontSize:8,lineHeight:1.2,color:'var(--green)',marginTop:1}}>✓ full</span>}
                          </div>;
                        })}
                      </div>
                    </div>
                  ))}
                </div>
                {form.selectedMonths.length>0 && (()=>{
                  const warnings = _gRent>0 ? form.selectedMonths.map(({month,year})=>{
                    const paid=_paidMap[`${month}|${year}`]||0;
                    return paid>0?{month,year,paid,remaining:_gRent-paid}:null;
                  }).filter(Boolean) : [];
                  return <>
                    <div style={{marginTop:10,padding:'8px 14px',background:'var(--green-light)',borderRadius:6,fontSize:13,color:'var(--green)',fontWeight:500}}>
                      {form.selectedMonths.length} month{form.selectedMonths.length>1?'s':''} selected
                      {form.selectedMonths.length>1 && form.perMonthAmount ? ` — Total: ₹${(form.selectedMonths.length*Number(form.perMonthAmount)).toLocaleString('en-IN')}` : ''}
                    </div>
                    {warnings.map(w=>(
                      <div key={`${w.month}|${w.year}`} style={{marginTop:6,padding:'6px 14px',background:'rgba(245,158,11,.08)',border:'1px solid rgba(245,158,11,.2)',borderRadius:6,fontSize:12,color:'var(--gold)'}}>
                        ⚠️ {w.month} {w.year}: ₹{w.paid.toLocaleString('en-IN')} already paid — ₹{Math.max(0,w.remaining).toLocaleString('en-IN')} remaining
                      </div>
                    ))}
                  </>;
                })()}
              </>;
            })()}
          </div>

          <div className="btn-row">
            <button className="btn btn-primary" onClick={()=>handleSave(false)} disabled={saving}>{saving?<><span className="spinner"/>&nbsp;Saving...</>:'Save'}</button>
            <button className="btn btn-primary" style={{background:'#25d366'}} onClick={()=>handleSave(true)} disabled={saving}>🧾 Save &amp; Generate Receipt</button>
            <button className="btn btn-secondary" onClick={()=>setMode(null)}>Cancel</button>
          </div>
        </div>
      )}

      {/* EDIT FORM — single month */}
      {mode && mode.editing && (
        <div className="card" style={{marginBottom:20}}>
          <div className="card-title">Edit Rent Record</div>
          <div className="form-grid">
            <div className="form-group"><label>Property *</label>
              <select value={editForm['Property ID']} onChange={e=>ef('Property ID',e.target.value)}>
                <option value="">Select property</option>
                {data.properties.map(p=><option key={p.ID} value={p.ID}>{p.Name}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Month</label>
              <select value={editForm.Month} onChange={e=>ef('Month',e.target.value)}>{MONTHS.map(m=><option key={m}>{m}</option>)}</select>
            </div>
            <div className="form-group"><label>Year</label>
              <select value={editForm.Year} onChange={e=>ef('Year',e.target.value)}>{YEARS.map(y=><option key={y}>{y}</option>)}</select>
            </div>
            <div className="form-group"><label>Amount (₹) *</label>
              <input type="number" value={editForm.Amount} onChange={e=>ef('Amount',e.target.value)}/>
              {editForm['Property ID'] && editForm.Month && editForm.Year && (()=>{
                const _ep=data.properties.find(p=>p.ID===editForm['Property ID']);
                const _er=Number(_ep?.['Rent Amount']||0);
                if(!_er) return null;
                const _oth=data.rent.filter(r=>r['Property ID']===editForm['Property ID']&&r.Month===editForm.Month&&String(r.Year)===String(editForm.Year)&&r.ID!==mode.id&&(r.Status==='Paid'||r.Status==='Partial')).reduce((s,r)=>s+Number(r.Amount||0),0);
                const _rem=_er-_oth;
                return <div style={{marginTop:5,fontSize:12,color:_oth>0?'var(--gold)':'var(--text-muted)'}}>
                  Rent: ₹{_er.toLocaleString('en-IN')}{_oth>0?` | Other entries: ₹${_oth.toLocaleString('en-IN')} | Max: ₹${Math.max(0,_rem).toLocaleString('en-IN')}`:` | Max: ₹${_er.toLocaleString('en-IN')}`}
                </div>;
              })()}
            </div>

// ── MAINTENANCE ───────────────────────────────────────────────────────────────
function Maintenance({ data, derived, onRefresh }) {
  const [mode, setMode]     = useState(null);
  const [saving, setSaving] = useState(false);
  const cashReserves = (derived?.reserves || []).filter(r => r.kind === 'Cash').map(r => r.name);
  const blank = { 'Property ID':'', Date: new Date().toISOString().split('T')[0], Description:'', Amount:'', Vendor:'', Category:'Repair', paidReserve:'Cash' };
  const [form, setForm]     = useState(blank);
  const f = (k,v) => setForm(p=>({...p,[k]:v}));

  const openAdd  = () => { setForm(blank); setMode('add'); };
  const openEdit = (m) => { setForm({...blank,...m, paidReserve: m['Paid Reserve']||''}); setMode({editing:m._row, id:m.ID}); };

  const handleSave = async (withReceipt = false) => {
    if (!form['Property ID']||!form.Description||!form.Amount) { alert('Property, description and amount required.'); return; }
    setSaving(true);
    try {
      if (mode==='add') {
        const mId = `M${Date.now()}`;
        await appendRow('Maintenance', [mId, form['Property ID'], form.Date, form.Description, form.Amount, form.Vendor, form.Category, form.paidReserve||'']);
        // Debit the paying reserve
        if (form.paidReserve && num(form.Amount) > 0) {
          const prop = data.properties.find(p=>p.ID===form['Property ID']);
          await addEntry('MNT-'+mId, form.Date, { reserve: form.paidReserve, direction:'Out', qty:num(form.Amount), value:num(form.Amount),
            counterparty: form.Vendor||'', category:'Maintenance', ref:mId, notes:`${form.Category}: ${form.Description}${prop?' @ '+prop.Name:''}` });
        }
      } else {
        await updateRow('Maintenance', mode.editing, [mode.id, form['Property ID'], form.Date, form.Description, form.Amount, form.Vendor, form.Category, form.paidReserve||'']);
      }
      setMode(null); onRefresh();
    } catch(e) { alert('Error: '+e.message); }
    setSaving(false);
  };

  const total = data.maintenance.reduce((s,m)=>s+Number(m.Amount||0),0);

  return (
    <div>
      <div className="section-row">
        <h3>Maintenance</h3>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/> Add Record</button>
      </div>

      {mode!==null && (
        <div className="card" style={{marginBottom:20}}>

// ── GOOGLE SIGN-IN GATE (whitelisted accounts only, on top of the PIN) ────────
function GoogleGate({ onDone }) {
  const cfg = getConfig();
  const btnRef = useRef();
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let tries = 0, cancelled = false;
    const init = () => {
      if (cancelled) return;
      if (!(window.google && window.google.accounts && window.google.accounts.id)) {
        if (tries++ < 60) return setTimeout(init, 100);
        setErr('Google sign-in library failed to load — check your connection.');
        return;
      }
      if (!cfg.clientId) { setErr('No Google Client ID set — add it in Setup.'); return; }
      window.google.accounts.id.initialize({
        client_id: cfg.clientId,
        callback: async (resp) => {
          setBusy(true); setErr('');
          try { await gatewayLogin(resp.credential); onDone(); }
          catch(e) { setErr(e.message || 'Sign-in failed'); setBusy(false); }
        },
      });
      if (btnRef.current) window.google.accounts.id.renderButton(btnRef.current, { theme:'filled_blue', size:'large', width:280, text:'signin_with' });
      window.google.accounts.id.prompt();
    };
    init();
    return () => { cancelled = true; };
  }, []);

  return (
    <div className="pin-screen"><div className="pin-box">
      <div className="pin-logo" style={{background:'var(--accent)'}}>🔐</div>
      <div className="pin-title">Sign in with Google</div>
      <div className="pin-sub">Only whitelisted Google accounts can open this app — this is in addition to your PIN.</div>
      <div ref={btnRef} style={{display:'flex',justifyContent:'center',margin:'10px 0'}}/>
      {busy && <div style={{fontSize:12,color:'var(--text-muted)'}}>Verifying account…</div>}
      {err && <div className="pin-error">{err}</div>}
      <span className="pin-toggle" style={{marginTop:14}} onClick={()=>{ setSession(null); localStorage.removeItem(STORE_KEY); window.location.reload(); }}>Reset app</span>
    </div></div>
  );
}

function PinScreen({ onUnlock }) {
  const isFirstTime = !hasEncryptedConfig();
  const [mode, setMode] = useState(isFirstTime ? 'setup' : 'unlock');
  const [pin, setPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [form, setForm] = useState({ jewelSheetId: '', rentSheetId: '', gatewayUrl: '', gatewaySecret: '', clientId: '', geminiKey: '' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [showShare, setShowShare] = useState(false);
  const [importCode, setImportCode] = useState('');
  const [showImport, setShowImport] = useState(false);
  const PIN_LEN = 4;

  const handleKey = async (k) => {
    if (loading) return;
    setError('');
    if (k === 'del') { setPin(p => p.slice(0, -1)); return; }
    const next = pin + k;
    setPin(next);
    if (next.length < PIN_LEN) return;

    if (mode === 'unlock') {
      setLoading(true);
      const cfg = await loadConfig(next);
      if (cfg) {
        setRuntimeConfig(cfg);
        onUnlock();
      } else {
        setError('Wrong PIN — try again');
        setTimeout(() => { setPin(''); setError(''); setLoading(false); }, 600);
      }
      setLoading(false);
    } else if (mode === 'confirm') {
      if (next === confirmPin) {
        setLoading(true);
        await persistConfig(next, form);
        setRuntimeConfig(form);
        setShowShare(true);
        setLoading(false);
      } else {
        setError('PINs do not match — try again');
        setTimeout(() => { setPin(''); setError(''); setLoading(false); }, 600);
      }
    }
  };

  const handleSetupNext = () => {
    if (!form.jewelSheetId || !form.gatewayUrl || !form.gatewaySecret || !form.clientId) { setError('Jewel Sheet ID, Gateway URL, Secret and Google Client ID are required.'); return; }
    setError('');
    setMode('choose-pin');
    setPin('');
  };

  const handleChoosePin = (k) => {
    if (k === 'del') { setPin(p => p.slice(0, -1)); return; }
    const next = pin + k;
    setPin(next);
    if (next.length < PIN_LEN) return;
    setConfirmPin(next);
    setPin('');
    setMode('confirm');
  };

  const handleImport = () => {
    const code = importCode.trim();
    if (!code) { setError('Paste the share code first.'); return; }
    try {
      localStorage.setItem(STORE_KEY, code);
      setMode('unlock');
      setPin(''); setError(''); setShowImport(false);
    } catch(e) { setError('Invalid code — ask the owner to share again.'); }
  };

  const copyShareLink = () => {
    const blob = localStorage.getItem(STORE_KEY);
    if (!blob) return;
    const url = `${window.location.origin}${window.location.pathname}?cfg=${encodeURIComponent(blob)}`;
    navigator.clipboard.writeText(url).then(()=>alert('Share link copied!\n\nSend it to family. When they open it, the app auto-loads — they just need the PIN.'));
  };

  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];

  if (showShare) return (
    <div className="pin-screen">
      <div className="pin-box">
        <div className="pin-logo" style={{background:'var(--green)'}}>✓</div>
        <div className="pin-title">Setup Complete!</div>
        <div className="pin-sub">Share access with family by sending the share link. They open it, enter the PIN, and they're in.</div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginBottom:10}} onClick={copyShareLink}>📋 Copy Share Link</button>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16,lineHeight:1.6,padding:'8px',background:'rgba(0,0,0,.2)',borderRadius:6}}>
          The link contains your encrypted config. Only the PIN can decrypt it — safe to share over WhatsApp.
        </div>
        <button className="btn btn-secondary" style={{width:'100%',justifyContent:'center'}} onClick={()=>{ setRuntimeConfig(form); onUnlock(); }}>Enter App →</button>
      </div>
    </div>
  );

  if (mode === 'setup') return (
    <div className="pin-screen">
      <div className="pin-box">
        <div className="pin-logo">💠</div>
        <div className="pin-title">Money Manager — First-time Setup</div>
        <div className="pin-sub">One app for Rent + Jewel + Investments. Deploy the Apps Script gateway first (see the ⓘ steps in Setup), then paste its URL, secret and your two Sheet IDs. Everything is PIN-encrypted — no Google login, no hourly timeout.</div>
        <div className="pin-setup-form">
          <div className="form-group"><label>Jewel Sheet ID <span style={{color:'var(--text-muted)',fontWeight:400}}>(reserves, stock, investments)</span></label><input placeholder="1BxiMVs0...jewel sheet id" value={form.jewelSheetId} onChange={e => setForm({...form, jewelSheetId: e.target.value})}/></div>
          <div className="form-group"><label>Rent Sheet ID <span style={{color:'var(--text-muted)',fontWeight:400}}>(optional — properties, tenants)</span></label><input placeholder="1CxjNVs0...rent sheet id" value={form.rentSheetId} onChange={e => setForm({...form, rentSheetId: e.target.value})}/></div>
          <div className="form-group"><label>Gateway Web-App URL <span style={{color:'var(--text-muted)',fontWeight:400}}>(ends in /exec)</span></label><input placeholder="https://script.google.com/macros/s/…/exec" value={form.gatewayUrl} onChange={e => setForm({...form, gatewayUrl: e.target.value})}/></div>
          <div className="form-group"><label>Gateway Secret</label><input type="password" placeholder="the SECRET you set in the script" value={form.gatewaySecret} onChange={e => setForm({...form, gatewaySecret: e.target.value})}/></div>
          <div className="form-group"><label>Google Client ID <span style={{color:'var(--text-muted)',fontWeight:400}}>(for the sign-in gate)</span></label><input placeholder="123456789-abc.apps.googleusercontent.com" value={form.clientId} onChange={e => setForm({...form, clientId: e.target.value})}/></div>
          <div className="form-group">
            <label>AI API Key — <span style={{color:'var(--text-muted)',fontWeight:400}}>optional</span></label>
            <input type="password" placeholder="sk-ant-... (Claude) or AIzaSy... (Gemini)" value={form.geminiKey} onChange={e => setForm({...form, geminiKey: e.target.value})}/>
          </div>
          {error && <div className="pin-error">{error}</div>}
          <button className="btn btn-primary" style={{width:'100%',marginTop:8,justifyContent:'center'}} onClick={handleSetupNext}>Next — Choose PIN →</button>
          <div style={{textAlign:'center',marginTop:12}}>
            <span className="pin-toggle" onClick={()=>setShowImport(o=>!o)}>Already have a share code? Import it</span>
          </div>
          {showImport && <div style={{marginTop:10}}>
            <div className="form-group"><label>Paste Share Code</label><textarea style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:6,padding:'8px',color:'var(--text-primary)',fontSize:11,width:'100%',height:80,fontFamily:'monospace'}} value={importCode} onChange={e=>setImportCode(e.target.value)} placeholder="Paste the share code here..."/></div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={handleImport}>Import & Enter PIN</button>
          </div>}
        </div>
      </div>
    </div>
  );

  const modeLabel    = mode === 'choose-pin' ? 'Choose a 4-digit PIN' : mode === 'confirm' ? 'Confirm your PIN' : 'Enter your PIN';
  const modeSubLabel = mode === 'choose-pin' ? 'Family members will use this PIN' : mode === 'confirm' ? 'Enter the same PIN again to confirm' : 'Keys are encrypted — PIN never leaves your device';

  return (
    <div className="pin-screen">
      <div className="pin-box">
        <div className="pin-logo">💎</div>
        <div className="pin-title">{modeLabel}</div>
        <div className="pin-sub">{modeSubLabel}</div>
        <div className="pin-dots">
          {Array.from({length: PIN_LEN}).map((_, i) => (
            <div key={i} className={`pin-dot ${i < pin.length ? (error ? 'error' : 'filled') : ''}`}/>
          ))}
        </div>
        <div className="pin-keypad">
          {keys.map((k, i) => k === '' ? <div key={i}/> : (
            <button key={i} className={`pin-key ${k === 'del' ? 'del' : ''}`}
              onClick={() => mode === 'choose-pin' ? handleChoosePin(k) : handleKey(k)}
              disabled={loading}
            >{k === 'del' ? '⌫' : k}</button>
          ))}
        </div>
        <div className="pin-error">{error}</div>
        {mode === 'unlock' && (<>
          <span className="pin-toggle" onClick={copyShareLink}>📋 Get share link (for new browser)</span>
          <span className="pin-toggle" style={{marginTop:6}} onClick={() => { setMode('setup'); setPin(''); localStorage.removeItem(STORE_KEY); }}>
            Reset &amp; re-enter keys
          </span>
        </>)}
      </div>
    </div>
  );
}

    if (newPin.length < 4) { setErr('PIN must be 4 digits.'); return; }
    const existing = await loadConfig(oldPin);
    if (!existing) { setErr('Current PIN is incorrect.'); return; }
    await persistConfig(newPin, existing);

            : <div style={{marginTop:12}}>
                <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
                  <div className="form-group"><label>Current PIN</label><input type="password" maxLength={4} placeholder="••••" value={oldPin} onChange={e => setOldPin(e.target.value.replace(/\D/g,''))}/></div>
                  <div className="form-group"><label>New PIN</label><input type="password" maxLength={4} placeholder="••••" value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g,''))}/></div>
                  <div className="form-group"><label>Confirm New PIN</label><input type="password" maxLength={4} placeholder="••••" value={confirmPin} onChange={e => setConfirmPin(e.target.value.replace(/\D/g,''))}/></div>
                </div>
                {err && <div style={{fontSize:12,color:'var(--red)',marginTop:6}}>{err}</div>}
                {msg && <div style={{fontSize:12,color:'var(--green)',marginTop:6}}>{msg}</div>}
                <div className="btn-row">
                  <button className="btn btn-primary" onClick={handleChangePIN}>Save New PIN</button>
                  <button className="btn btn-secondary" onClick={() => { setShowChange(false); setErr(''); }}>Cancel</button>
                </div>
              </div>
          }
        </div>
      </div>

      <div className="setup-step">
        <div className="setup-num" style={{background:'var(--red-light)',color:'var(--red)'}}>!</div>
        <div className="setup-text">
          <h3>Clear Cache &amp; Reset PIN</h3>
          <p>Clears your encrypted keys from this browser. <strong>Your Google Sheet data is NOT affected.</strong></p>
          <button className="btn btn-danger btn-sm" style={{marginTop:10}} onClick={()=>{
            if(window.confirm('Clear all cached keys and sign out? Your Sheet data is safe.')) {
              localStorage.removeItem(STORE_KEY);
              localStorage.removeItem(SESSION_KEY);
              window.location.reload();
            }
          }}>Clear Cache &amp; Reset PIN</button>
        </div>
      </div>

      <div style={{marginTop:16,padding:'14px 16px',background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.2)',borderRadius:8,fontSize:12,color:'var(--text-secondary)',lineHeight:1.7}}>
        <strong style={{color:'var(--green)'}}>Your data is safe:</strong> Everything is stored in your own Google Sheet. Keys are AES-256 encrypted in localStorage. No server involved.
      </div>
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App() {
  const [unlocked, setUnlocked] = useState(false);
  const [gated, setGated] = useState(false);
  const [page, setPage] = useState('home');
  const [editTxn, setEditTxn] = useState(null);
  const [rentTarget, setRentTarget] = useState(null);
  const [data, setData] = useState({ stock: [], reserves: [], banks: [], entries: [], lending: [], payments: [], reminders: [], investments: [], investSchedule: [], properties: [], tenants: [], rent: [], maintenance: [], utilities: [] });
  const [loading, setLoading] = useState(false);
  const [authed, setAuthed] = useState(false);
  const [loadError, setLoadError] = useState('');

  const configReady = () => { const c = getConfig(); return !!(c.gatewayUrl && c.gatewaySecret && c.jewelSheetId && c.clientId); };

  useEffect(() => {
    if (!unlocked || !gated) return;
    setAuthed(configReady());
  }, [unlocked, gated]);

  const loadData = useCallback(async () => {
    if (!unlocked || !gated || !configReady()) return;
    setLoading(true);
    setLoadError('');
    try {
      // Schema migration + reserve seeding only when the schema or sheet IDs changed.
      const sig = schemaSig();
      if (localStorage.getItem(SCHEMA_SIG_KEY) !== sig) {
        await initSheets();
        localStorage.setItem(SCHEMA_SIG_KEY, sig);
      }
      // Two batched calls (one per spreadsheet) instead of one call per tab.
      const cfg = getConfig();
      const [j, r] = await Promise.all([readAllSheets('jewel'), cfg.rentSheetId ? readAllSheets('rent') : {}]);
      setData({
        stock: j.Stock||[], reserves: j.Reserves||[], banks: j.Banks||[], entries: j.Entries||[],
        lending: j.Lending||[], payments: j.Payments||[], reminders: j.Reminders||[], investments: j.Investments||[], investSchedule: j.InvestSchedule||[],
        properties: r.Properties||[], tenants: r.Tenants||[], rent: r.Rent||[], maintenance: r.Maintenance||[], utilities: r.Utilities||[],
      });
      setAuthed(true);
    } catch (e) {
      if (e.needLogin) { setGated(false); setLoadError('Session expired — please sign in with Google again.'); }
      else { console.error('loadData error:', e); setLoadError('Load error: ' + e.message); }
    }
    setLoading(false);
  }, [unlocked, gated]);

  useEffect(() => { if (unlocked && gated) loadData(); }, [loadData, unlocked, gated]);

  const derived = useMemo(() => computeReserves(data), [data]);

  // Grouped navigation: top tabs on desktop, bottom tab bar on mobile,
  // per-group pill row for the pages inside the active group.
  const GROUPS = [
    { id:'homeG',  label:'Home',   emoji:'🏠', pages:[['home','🏠 Home'],['dashboard','⚡ Quick View']] },
    { id:'jewelG', label:'Jewel',  emoji:'💎', pages:[['reserves','Reserves'],['convert','New Txn'],['transactions','Transactions'],['lending','Lending'],['expenses','Expenses'],['stock','Stock']] },
    { id:'rentG',  label:'Rent',   emoji:'🏢', pages:[['rent','Rent'],['properties','Properties'],['tenants','Tenants'],['maintenance','Maintenance'],['utilities','Utilities']] },
    { id:'investG',label:'Invest', emoji:'📈', pages:[['investments','Investments']] },
    { id:'moreG',  label:'More',   emoji:'⚙️', pages:[['reminders','Reminders'],['nlp','Ask AI'],['setup','Setup']] },
  ];
  const activeGroup = GROUPS.find(g => g.pages.some(p => p[0] === page)) || GROUPS[0];
  const goGroup = (g) => { setEditTxn(null); setPage(g.pages[0][0]); };
  const goPage = (id) => { setEditTxn(null); setPage(id); };

  const titles = {
    home: ['Home', 'Insights across rent, jewel & investments'],
    dashboard: ['Quick View', 'Reserves, rent and reminders at a glance'],
    reserves: ['Reserves', 'Balances, opening & per-reserve ledger'],
    convert: ['New Transaction', 'Convert between reserves — sell, buy, exchange'],
    transactions: ['Transactions', 'View and edit past transactions'],
    lending: ['Lending', 'Cash or metal given to help — track returns & interest'],
    expenses: ['Expenses', 'Money spent out of the Cash reserve'],
    stock: ['Stock', 'Boxes & pockets — physical opening inventory'],
    properties: ['Properties', 'Your rental properties'],
    tenants: ['Tenants', 'Tenant details'],
    rent: ['Rent', 'Monthly rent — collect into a Cash/Bank reserve'],
    maintenance: ['Maintenance', 'Property expenses paid from a reserve'],
    utilities: ['Utilities', 'Electricity, tax & water numbers'],
    investments: ['Investments', 'Bonds, FD & RD — funded from a reserve, repayments credited back'],
    reminders: ['Reminders', 'Follow-ups to close'],
    nlp: ['Ask AI', 'Natural language questions about your data'],
    setup: ['Setup', 'Gateway, sign-in and API keys'],
  };
  const [title, subtitle] = titles[page] || ['', ''];

  const renderPage = () => {
    if (!authed && page !== 'setup') {
      return (
        <div className="card" style={{maxWidth:480,margin:'40px auto',textAlign:'center',padding:'32px'}}>
          <div style={{fontSize:32,marginBottom:16}}>💠</div>
          <h2 style={{marginBottom:8,fontSize:16}}>Welcome to Money Manager</h2>
          <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:20,lineHeight:1.6}}>Deploy the Apps Script gateway and enter its details in Setup. Your rent, jewel and investment data stay in your own private Google Sheets.</p>
          <button className="btn btn-primary" onClick={() => setPage('setup')}>Start Setup →</button>
        </div>
      );
    }
    switch (page) {
      case 'home': return <InsightsHome data={data} derived={derived} onNav={goPage}/>;
      case 'dashboard': return <Dashboard data={data} derived={derived} onNav={setPage} onRefresh={loadData}/>;
      case 'reserves': return <ReservesPage data={data} derived={derived} onRefresh={loadData} onNew={()=>{setEditTxn(null);setPage('convert');}}/>;
      case 'convert': return <Convert key={editTxn?editTxn.txnId:'new'} data={data} derived={derived} edit={editTxn} onRefresh={loadData} onDone={()=>{setEditTxn(null);setPage(editTxn?'transactions':'reserves');}}/>;
      case 'transactions': return <Transactions data={data} derived={derived} onRefresh={loadData} onNew={()=>{setEditTxn(null);setPage('convert');}} onEdit={(g)=>{setEditTxn(g);setPage('convert');}} onNav={setPage}/>;
      case 'lending': return <Lending data={data} derived={derived} onRefresh={loadData}/>;
      case 'expenses': return <Expenses data={data} derived={derived} onRefresh={loadData}/>;
      case 'stock': return <Stock data={data} derived={derived} onRefresh={loadData}/>;
      case 'properties': return <Properties data={data} onRefresh={loadData} onGoToRent={(propId)=>{ setRentTarget(propId); setPage('rent'); }}/>;
      case 'tenants': return <Tenants data={data} derived={derived} onRefresh={loadData}/>;
      case 'rent': return <Rent data={data} derived={derived} onRefresh={loadData} initialPropId={rentTarget} onClearTarget={()=>setRentTarget(null)}/>;
      case 'maintenance': return <Maintenance data={data} derived={derived} onRefresh={loadData}/>;
      case 'utilities': return <Utilities data={data} onRefresh={loadData}/>;
      case 'investments': return <Investments data={data} derived={derived} onRefresh={loadData}/>;
      case 'reminders': return <Reminders data={data} derived={derived} onRefresh={loadData}/>;
      case 'nlp': return <NLPQuery data={data} derived={derived}/>;
      case 'setup': return <Setup/>;
      default: return null;
    }
  };

  if (!unlocked) return <PinScreen onUnlock={() => { setUnlocked(true); setGated(sessionValid()); }} />;
  if (!gated) return <GoogleGate onDone={() => setGated(true)} />;

  return (
    <div className="app-shell">
      <header className="topnav">
        <div className="logo-mark">💠</div>
        <div className="topnav-title">Money Manager</div>
        <nav className="topnav-tabs">
          {GROUPS.map(g => (
            <button key={g.id} className={`topnav-tab ${activeGroup.id===g.id?'active':''}`} onClick={()=>goGroup(g)}>
              <span>{g.emoji}</span><span>{g.label}</span>
            </button>
          ))}
        </nav>
        <div className="topnav-right">
          {!authed && <div className="setup-badge" onClick={() => setPage('setup')}>⚙ Setup</div>}
          {authed && (
            <button className="btn btn-secondary btn-sm" onClick={loadData} disabled={loading} title="Refresh data">
              {loading ? <span className="spinner"/> : '↻'}
            </button>
          )}
        </div>
      </header>

      {activeGroup.pages.length > 1 && (
        <div className="subnav">
          {activeGroup.pages.map(([id, label]) => (
            <button key={id} className={`subnav-pill ${page===id?'active':''}`} onClick={()=>goPage(id)}>{label}</button>
          ))}
        </div>
      )}

      {loadError && (
        <div style={{background:'var(--red-light)',border:'1px solid rgba(239,68,68,.3)',padding:'10px 20px',fontSize:13,color:'var(--red)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span>⚠️ {loadError}</span>
          <button className="btn btn-secondary btn-sm" onClick={()=>setLoadError('')}>Dismiss</button>
        </div>
      )}

      <div className="content">
        {page !== 'home' && (
          <div className="page-head">
            <div>
              <h2>{title}</h2>
              <p>{subtitle}</p>
            </div>
          </div>
        )}
        {renderPage()}
      </div>

      <nav className="bottombar">
        {GROUPS.map(g => (
          <button key={g.id} className={activeGroup.id===g.id?'active':''} onClick={()=>goGroup(g)}>
            <span className="bb-emoji">{g.emoji}</span>
            <span>{g.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
